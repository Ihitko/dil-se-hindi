/* ---------- motion: GSAP when present, nothing when Reduce Motion ---------- */
const RM = ()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
const G = ()=> (window.gsap && !RM()) ? window.gsap : null;
function pigColor(name){ return getComputedStyle(document.documentElement).getPropertyValue("--"+name).trim()||"#E0157A"; }
// Gulal powder: soft puffs thrown from a point, drifting and fading
function burst(x,y,opts){
  if(RM()) return; opts=opts||{};
  const n=opts.n||28, cols=(opts.pig||["rani","kesari","haldi","mor"]).map(pigColor);
  const c=document.createElement("canvas"); c.className="powder"; const dpr=Math.min(2,devicePixelRatio||1), W=innerWidth, Hh=innerHeight;
  c.width=W*dpr; c.height=Hh*dpr; c.style.width=W+"px"; c.style.height=Hh+"px"; document.body.appendChild(c);
  const g=c.getContext("2d"); g.scale(dpr,dpr);
  const P=[...Array(n)].map(()=>{ const a=Math.random()*Math.PI*2, v=(opts.v||5)*(0.35+Math.random()); return {x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-(opts.up||2), r:(opts.size||7)*(0.5+Math.random()), c:cols[Math.floor(Math.random()*cols.length)]}; });
  const t0=performance.now(), life=opts.life||1100;
  (function f(t){ const k=(t-t0)/life; g.clearRect(0,0,W,Hh);
    P.forEach(p=>{ p.vx*=.94; p.vy=p.vy*.94+.12; p.x+=p.vx; p.y+=p.vy; p.r*=1.012;
      const a=Math.max(0,1-k)*0.85; const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); gr.addColorStop(0,p.c); gr.addColorStop(1,"transparent");
      g.globalAlpha=a; g.fillStyle=gr; g.beginPath(); g.arc(p.x,p.y,p.r,0,6.283); g.fill(); });
    if(k<1) requestAnimationFrame(f); else c.remove(); })(t0);
}
function burstAt(el,opts){ if(!el) return; const r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, opts); }
// A small temple-bell chime (ghanti) for right answers and finished sessions
const Bell={ctx:null};
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function chime(kind){
  if(!S.settings.sound) return;
  if(IOS && AudioS.web && !AudioS.tts && kind!=="done") return;
  try{
    const C=Bell.ctx||(Bell.ctx=new (window.AudioContext||window.webkitAudioContext)()); if(C.state==="suspended") C.resume();
    const t=C.currentTime, seq= kind==="done"? [659.25,987.77,1318.5] : [1046.5];
    seq.forEach((f,i)=>{ [[f,0.09],[f*2.76,0.025]].forEach(([fr,vol])=>{ const o=C.createOscillator(), gn=C.createGain(); o.type="sine"; o.frequency.value=fr;
      const s0=t+i*0.11; gn.gain.setValueAtTime(0.0001,s0); gn.gain.exponentialRampToValueAtTime(vol,s0+0.012); gn.gain.exponentialRampToValueAtTime(0.0001,s0+1.2);
      o.connect(gn).connect(C.destination); o.start(s0); o.stop(s0+1.25); }); });
  }catch(e){}
}

/* ---------- the rangoli: every phrase a dot of pigment ---------- */
function rgItems(){ return UNITS.filter(u=>u.track==="speak").flatMap(u=>u.items).concat(CUSTOM_UNIT.items).slice(0,640); }
function rgLayout(n){
  const pts=[]; let k=0;
  while(pts.length<n){ const r=56+k*9.2, cnt=Math.max(8,8*Math.round(2*Math.PI*r/(10.6*8))), off=(k%2)*Math.PI/cnt;
    for(let j=0;j<cnt&&pts.length<n;j++){ const a=-Math.PI/2+off+j*2*Math.PI/cnt; pts.push([+(150+r*Math.cos(a)).toFixed(2),+(150+r*Math.sin(a)).toFixed(2)]); }
    k++; }
  return pts;
}
function rgScallop(){ let d=""; const n=40, R=148; for(let j=0;j<n;j++){ const a1=-Math.PI/2+j*2*Math.PI/n, a2=a1+2*Math.PI/n;
  d+=`M${(150+R*Math.cos(a1)).toFixed(1)} ${(150+R*Math.sin(a1)).toFixed(1)}A11.6 11.6 0 0 1 ${(150+R*Math.cos(a2)).toFixed(1)} ${(150+R*Math.sin(a2)).toFixed(1)}`; } return d; }
const RG_SCALLOP = rgScallop();
function rangoliSVG(opt){
  opt=opt||{};
  const items=rgItems(), pts=rgLayout(items.length), now=Date.now(), bloom=new Set(opt.bloom||[]);
  let lit=0, due=0, dots="", halos="";
  items.forEach((it,i)=>{ const [x,y]=pts[i], rec=S.items[it.id];
    if(rec && rec.b>=1){ lit++; const isDue=rec.d<=now; if(isDue) due++;
      if(bloom.has(it.id)) halos+=`<circle class="halo" cx="${x}" cy="${y}" r="6" style="fill:none;stroke:var(--${pigOf(UNIT_OF[it.id])});stroke-width:1.6;opacity:0"/>`;
      dots+=`<circle class="dt${bloom.has(it.id)?" bl":""}" cx="${x}" cy="${y}" r="${(2.5+rec.b*0.42).toFixed(2)}" style="fill:var(--${pigOf(UNIT_OF[it.id])})${opt.due&&isDue?";stroke:var(--ink);stroke-width:1.4":""}"/>`; }
    else dots+=`<circle cx="${x}" cy="${y}" r="1.7" style="fill:none;stroke:var(--dot-off);stroke-width:.9"/>`;
  });
  const label=`Your rangoli: ${lit} of ${items.length} phrases learned${due?`, ${due} due for review`:""}`;
  return `<svg viewBox="-14 -14 328 328" role="img" aria-label="${label}"><g class="rg-art" style="fill:none;stroke:var(--line-art);stroke-width:1"><circle cx="150" cy="150" r="49"/><path d="${RG_SCALLOP}"/></g><g class="rg-dots">${dots}</g>${halos?`<g class="rg-halos" aria-hidden="true">${halos}</g>`:""}</svg>`;
}
function medalWord(){
  const nw=view.newest&&ITEM[view.newest];
  if(nw && learned(nw)) return {it:nw,label:"Newest"};
  const pool=rgItems().filter(learned); if(!pool.length) return null;
  let h=0; for(const ch of dayKey()) h=(h*31+ch.charCodeAt(0))>>>0;
  return {it:pool[h%pool.length], label:"Today's word"};
}
function medalHTML(){
  const m=medalWord();
  if(!m) return `<button class="medal" data-saytext="नमस्ते" aria-label="Hear namaste, hello"><span class="deva">नमस्ते</span><small>Your first word</small></button>`;
  return `<button class="medal" data-saytext="${esc(H(m.it))}" aria-label="${esc(m.label)}: ${esc(R(m.it))}, ${esc(m.it.en)}. Tap to hear it"><span class="deva">${esc(H(m.it))}</span><small>${esc(R(m.it))}</small></button>`;
}

function render(){
  if(session) return renderSession();
  const v=view.name, app=$("#app");
  const body = v==="home"?homeView(): v==="path"?journeyView(): v==="practice"?practiceView(): v==="book"?wordsView(): v==="profile"?meView(): v==="review"?reviewView(): v==="story"?storyView(): v==="talk"?talkView(): homeView();

  render.last=v; render.lastTab=curTab;

  syncScroll(); markHindi(app);
  afterRender(v, prev, prevTab, curTab);
}
function afterRender(v, prev, prevTab, curTab){
  const g=G();
  // the tab lens slides between tabs
  if(g && prevTab && prevTab!==curTab){ const lens=$(".tabs .lens"), a=TABS.findIndex(t=>t[0]===prevTab), b=TABS.findIndex(t=>t[0]===curTab);
    if(lens && a>=0 && b>=0) g.fromTo(lens,{xPercent:a*100,x:0},{xPercent:b*100,duration:.5,ease:"expo.out"}); }
  // pushed screens slide in like a navigation push and back out the other way; tab switches simply appear (as on iOS)
  if(g && prev && prev!==v){
    if(PARENT[v]===prev) g.fromTo(".page",{x:32,autoAlpha:.3},{x:0,autoAlpha:1,duration:.45,ease:"expo.out",clearProps:"transform,opacity,visibility"});
    else if(PARENT[prev]===v) g.fromTo(".page",{x:-24,autoAlpha:.5},{x:0,autoAlpha:1,duration:.4,ease:"expo.out",clearProps:"transform,opacity,visibility"});
  }
  if(v==="home") rangoliMoment();
}
// The one authored moment: earned dots are thrown in like powder and settle into the rangoli
function rangoliMoment(){
  const g=G(), wrap=$(".today-field .rg-wrap");
  if(!wrap) return;
  const fresh=$$(".dt.bl",wrap);
  if(fresh.length){
    view.bloom=null;
    if(g){ g.from(fresh,{x:()=>g.utils.random(-170,170), y:()=>g.utils.random(-190,150), scale:0, opacity:0, transformOrigin:"50% 50%", duration:1.15, ease:"expo.out", stagger:{each:.035,from:"random"},
      onComplete:()=>{ burstAt($(".today-field .medal"),{n:22,v:4,size:9,pig:["rani","kesari","haldi"]});
        g.fromTo($$(".rg-halos .halo",wrap),{opacity:.95,scale:.5,transformOrigin:"50% 50%"},{opacity:0,scale:2.8,duration:1.1,ease:"expo.out",stagger:.04}); }});
      g.from(".today-field .medal",{scale:.7,duration:.7,delay:.5,ease:"back.out(2)"}); }
    return;
  }
  if(!rangoliMoment.drawn){ rangoliMoment.drawn=true;
    if(g){ const dots=$$(".rg-dots circle",wrap); g.from(dots,{scale:.55,transformOrigin:"50% 50%",duration:.6,ease:"expo.out",stagger:{each:.0012}});
      g.from(".today-field .rg-art",{rotation:-12,svgOrigin:"150 150",duration:1.2,ease:"expo.out"}); }
  }
}

/* ---------- Journey ---------- */
function bead(inner, lv, open){
  // three lesson dots set around the bead like the points of a rangoli
  const dots=[0,1,2].map(i=>{ const a=(-90+i*120)*Math.PI/180; return `<circle cx="${(24+20.6*Math.cos(a)).toFixed(2)}" cy="${(24+20.6*Math.sin(a)).toFixed(2)}" r="3.3" style="fill:${lv>i?"var(--sc)":"var(--surface)"};stroke:${lv>i?"var(--sc)":"var(--dot-off)"};stroke-width:1.2"/>`; }).join("");
  return `<span class="bead"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16.5" style="fill:var(--surface);stroke:${open?"var(--sc)":"var(--hair)"};stroke-width:${open?1.6:1.2}"/>${lv>=0?dots:""}</svg>${inner}</span>`;
}
function unitRow(u){
  const lv=S.units[u.id]||0, open=unitUnlocked(u), done=lv>=3, nl=u.items.filter(learned).length, isNext=open&&!done&&nextUnit(u.track)===u;
  const kind = u.track==="read"?"letters":"phrases";
  const meta = !open ? "Finish 2 lessons above to unlock" : done ? `Complete, ${nl} of ${u.items.length} learned` : lv ? `Lesson ${lv+1} of 3, ${nl} of ${u.items.length} learned` : `${u.items.length} ${kind}${u.drills.length?`, ${u.drills.length} grammar drills`:""}`;
  const end = isNext ? `<span class="pill-next">Next</span>` : done ? `<span style="color:var(--sc)">${IC.check}</span>` : !open ? `<span class="lk">${IC.lock}</span>` : IC.chevR;
  return `<button class="bead-row ${open?"":"locked"} ${isNext?"next":""}" ${open?`data-unit="${u.id}"`:"disabled"}>${bead(`<span class="deva">${esc(firstAkshara(u.glyph))}</span>`, lv, open)}<span class="row-main"><b>${esc(u.title)}</b><span>${esc(meta)}</span></span><span class="row-end">${end}</span></button>`
    + SCENES.filter(sc=>sc.after===u.id).map(sceneRow).join("");
}
function sceneRow(sc){
  const open=(S.units[sc.after]||0)>=1, best=S.scenes[sc.id]||0, after=UNITS.find(u=>u.id===sc.after);
  const meta = !open ? `Conversation, unlocks after a lesson of ${after.title}` : best ? `Conversation, best ${best}%` : "Conversation, about two minutes";
  return `<button class="bead-row scene-row ${open?"":"locked"}" ${open?`data-scene="${sc.id}"`:"disabled"}>${bead(IC.chat,-1,open)}<span class="row-main"><b>${esc(sc.title)}</b><span>${esc(meta)}</span></span><span class="row-end">${open?IC.chevR:`<span class="lk">${IC.lock}</span>`}</span></button>`;
}
function scrollToNext(){ const n=$(".bead-row.next"); if(n) n.scrollIntoView({block:"center"}); }
function journeyView(){

      const us=UNITS.filter(u=>u.track==="speak"&&u.stage===st.n), done=us.filter(u=>(S.units[u.id]||0)>=3).length, open=us.some(unitUnlocked), p=PIG_STAGE[st.n];

/* ---------- Memory (review) ---------- */
function reviewView(){
  const due=dueItems(), counts=[0,0,0,0,0,0];
  Object.keys(S.items).forEach(id=>{ if(ITEM[id]) counts[S.items[id].b]++; });
  const learnedIds=Object.keys(S.items).filter(id=>ITEM[id]&&S.items[id].b>=1);
  const next=learnedIds.map(id=>S.items[id].d).filter(d=>d>Date.now()).sort((a,b)=>a-b)[0];
  let when=""; if(next){ const h=Math.round((next-Date.now())/HOUR); when=h<1?"in under an hour":h<24?`in about ${h} hour${h===1?"":"s"}`:`in ${Math.round(h/24)} day${Math.round(h/24)===1?"":"s"}`; }

  const act = due.length ? `<button class="btn block" data-act="review">${IC.memory}Review ${due.length} due</button>` : learnedIds.length ? `<button class="btn block tonal" data-act="weak">Practise your weakest phrases</button>` : "";

  + `<section class="field f-today today-field" style="--stage:var(--${PIG_STAGE[myStage()]})"><div class="rg-wrap">${rangoliSVG({due:true})}${medalHTML()}</div>${act}</section>

/* ---------- sheets (iOS style) ---------- */
function openSheet(inner, ret){
  openSheet.gen=(openSheet.gen||0)+1; closeModal.busy=false;   // a sheet opened mid-close must survive that close
  closeModal.ret = ret || openSheet.lastTap || null;
  $("#modal-root").innerHTML=`<div class="scrim" data-act="closemodal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h" data-stop>${inner}</div></div>`;
  markHindi($("#modal-root"));
  const g=G(); if(g){ g.fromTo("#modal-root .scrim",{autoAlpha:0},{autoAlpha:1,duration:.25}); g.fromTo("#modal-root .sheet",{yPercent:100},{yPercent:0,duration:.52,ease:"expo.out"}); }
  const f=$("#modal-root .sheet .btn")||$("#modal-root .sheet button"); if(f) f.focus({preventScroll:true});
}
function showTip(uid){
  const u=UNITS.find(x=>x.id===uid);
  openSheet(`<button class="sheet-x" data-act="closemodal" aria-label="Close">${IC.close}</button><h2 id="sh-h">${esc(u.title)}</h2><div class="gbody">${u.tip}</div><button class="btn block" data-act="closemodal">Start the lesson</button>`);
}
function confirmSheet(title, text, okLabel, onOk){
  openSheet(`<h2 id="sh-h">${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="row2"><button class="btn tonal" data-act="closemodal">Cancel</button><button class="btn" id="confirm-ok" style="background:var(--bad-btn);color:var(--on-verdict)">${esc(okLabel)}</button></div>`);
  $("#confirm-ok").onclick=()=>{ closeModal(true); onOk(); };
  const c=$("#modal-root .btn.tonal"); if(c) c.focus({preventScroll:true});
}
function closeModal(silent){
  const root=$("#modal-root"), sh=root.querySelector(".sheet"), g=G(), gen=openSheet.gen;
  const done=()=>{ if(gen!==openSheet.gen) return; root.innerHTML=""; if(!silent && session && session.i===0 && session.state==="answer") autoSay(session.queue[0]); if(session){ const n=$(".dock .btn:not([disabled])"); if(n) n.focus({preventScroll:true}); }
    else if(closeModal.ret){ const el=$(closeModal.ret); if(el && !el.disabled) el.focus({preventScroll:true}); } };
  if(g && sh && !silent && !closeModal.busy){ closeModal.busy=true; g.to(sh,{yPercent:100,duration:.26,ease:"power2.in"}); g.to(root.querySelector(".scrim"),{autoAlpha:0,duration:.26,onComplete:()=>{ closeModal.busy=false; done(); }}); }
  else if(!closeModal.busy) done();
}
const modalOpen = ()=>!!$("#modal-root").innerHTML;
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); announce(msg);
  const g=G(); if(g) g.from(t,{y:16,autoAlpha:0,duration:.35,ease:"expo.out"}); setTimeout(()=>{ if(g) g.to(t,{autoAlpha:0,y:8,duration:.25,onComplete:()=>t.remove()}); else t.remove(); },2300); }

/* ---------- lesson deck ---------- */
function optClass(ex,o,isRight){ if(session.state!=="feedback") return ""; if(isRight) return "right"; return o===ex.sel ? "wrong" : ""; }
function sayBtns(text){ return hasAudio()? `<button class="say" data-saytext="${esc(text)}" aria-label="Play audio">${IC.speak}</button><button class="say slow" data-saytext="${esc(text)}" data-slow="1" aria-label="Play slowly">${IC.turtle}</button>`:""; }
function bigSay(text){ return hasAudio()? `<div class="say-row" style="justify-content:center;padding:6px 0"><button class="say xl" data-saytext="${esc(text)}" aria-label="Play audio">${IC.speak}</button><button class="say slow" data-saytext="${esc(text)}" data-slow="1" aria-label="Play slowly">${IC.turtle}</button></div>`:""; }
function lessonPig(){
  const s=session; if(!s) return "rani";
  if(s.kind==="scene") return "rani"; if(s.kind==="story") return LVL_PIG[s.story.level]||"rani";

}
const optBtn=(attr,i,cls,body,dis,pressed)=>`<button class="opt ${cls}" ${attr} aria-pressed="${pressed}" ${dis?"disabled":""}><span class="k">${i+1}</span><span class="txt">${body}</span></button>`;
function exParts(ex){
  if(ex.t==="clock") return clockParts(ex);
  if(ex.t==="gym"||ex.t==="num") return gymParts(ex);
  const s=session, it=ex.it, read=it&&UNIT_OF[it.id]&&UNIT_OF[it.id].track==="read", fb=s.state==="feedback";

    return [`<span class="newtag">Conversation</span><h2 class="qen" style="font-family:var(--f-display);font-size:1.75rem">${esc(sc.title)}</h2><p>${esc(sc.intro)}</p>`,

    return [`<span class="qkind" style="color:var(--rani-t)">${esc(st.who)}</span><span class="qword" style="font-size:clamp(1.7rem,7.5vw,2.3rem)">${esc(H(st))}</span><div class="say-row">${sayBtns(H(st))}<span class="rom">${esc(R(st))}</span></div><button class="reveal hid" data-reveal aria-label="Reveal English">${esc(st.en)}</button>`, ""]; }
  if(ex.t==="ask"){ const st=ex.st;
    const opts=st.opts.map((o,i)=>{ const tried=ex.tried.has(i), cls= fb? (o.ok&&s.feedback.ok?"right": i===ex.sel&&!o.ok?"wrong":"") : (tried?"wrong":"");
      const body = o.plain? `<span>${esc(o.plain)}</span>` : `<span class="deva">${esc(H(o))}</span><small>${esc(R(o))}</small>${tried||(fb&&i===ex.sel)?`<small><i>${esc(o.en)}</i></small>`:""}`;
      return optBtn(`data-ask="${i}"`,i,cls,body,tried||fb,ex.sel===i); }).join("");
    return [`<span class="qkind">${s.kind==="story"?`Question ${s.i+1} of ${s.queue.length}`:"Your turn"}</span><p class="qen">${esc(st.ask)}</p>`, `<div class="opts" role="group">${opts}</div>`]; }

  if(ex.t==="intro"){
    return [`<span class="newtag">${it.love?"New, for her":read?"New letter":"New phrase"}</span><span class="${read?"qletter":"qword"}">${esc(H(it))}</span><div class="say-row">${btns}<span class="rom" style="font-size:1.25rem;color:var(--ink);font-weight:700">${esc(R(it))}</span></div><p class="qen">${esc(read?it.hint:it.en)}</p>`,
      `${it.note?`<div class="note">${it.note}</div>`:""}${it.hiF?`<div class="note">${female()?"A man would say":"A woman would say"} <span class="deva">${esc(female()?it.hi:it.hiF)}</span> <i>${esc(female()?it.rom:it.romF)}</i></div>`:""}`]; }
  if(ex.t==="pick_en"){
    return [`<span class="qkind">${read?"What sound does this make?":"What does this mean?"}</span><span class="${read?"qletter":"qword"}">${esc(H(it))}</span><div class="say-row">${btns}${read?"":romHTML(it)}</div>`,
      `<div class="opts" role="group">${ex.opts.map((o,i)=>optBtn(`data-opt="${o.id}"`,i,optClass(ex,o.id,o.id===it.id), read?`<b style="font-size:1.15rem">${esc(o.en)}</b><small>${esc(o.hint)}</small>`:`<span>${esc(o.en)}</span>`, fb, ex.sel===o.id)).join("")}</div>`]; }

    const card = ex.t==="listen" ? `<span class="qkind">Tap what you hear</span>${bigSay(H(it))}` : `<span class="qkind">${read?"Which letter is this?":"How do you say this?"}</span><p class="qen">${read?`${esc(it.en)} <small class="muted" style="font-weight:500">${esc(it.hint)}</small>`:esc(it.en)}</p>`;
    return [card, `<div class="opts" role="group">${ex.opts.map((o,i)=>optBtn(`data-opt="${o.id}"`,i,(read?"glyph ":"")+optClass(ex,o.id,o.id===it.id), `<span class="deva">${esc(H(o))}</span>${read?"":`<small>${showRom(o)==="show"||fb?esc(R(o)):""}</small>`}${fb&&!read&&o.id!==it.id?`<small><i>${esc(o.en)}</i></small>`:""}`, fb, ex.sel===o.id)).join("")}</div>`]; }
  if(ex.t==="cloze"){

  const input=(ph,lab,mode)=>`<label for="type-in" class="fieldlabel">${lab}</label><input id="type-in" class="typein" type="text" ${mode?`inputmode="${mode}"`:""} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ph}" value="${esc(ex.val)}" ${fb?"disabled":""}>`;
  if(ex.t==="type") return [`<span class="qkind">Write this in Hindi</span><p class="qen">${esc(it.en)}</p>${gnote}`, input("e.g. namaste","In English letters or Hindi script")];
  if(ex.t==="dictate") return [`<span class="qkind">Type what you hear</span>${bigSay(H(it))}`, input("What did you hear?","In English letters or Hindi script")];
  if(ex.t==="type_read") return [`<span class="qkind">How does this sound?</span><span class="qletter" style="${[...it.hi].length>3?"font-size:clamp(3.2rem,16vw,5rem)":""}">${esc(it.hi)}</span>`, input("e.g. ka","Type the sound in English letters")];

    return [card,below]; }
  if(ex.t==="build"){

      `<div class="answer-zone" role="group" aria-label="Your answer">${ex.placed.map(k=>{const t=ex.tiles[k];return `<button class="tile" data-unplace="${k}" ${fb?"disabled":""}><span class="deva">${esc(t.w)}</span><small>${esc(t.r)}</small></button>`;}).join("")}</div>
      <div class="bank">${ex.tiles.map(t=>`<button class="tile ${ex.placed.includes(t.k)?"used":""}" data-place="${t.k}" ${fb?"disabled":""}><span class="deva">${esc(t.w)}</span><small>${esc(t.r)}</small></button>`).join("")}</div>`]; }
  if(ex.t==="match"){

      `<div class="match"><div class="col">${ex.left.map(it=>`<button class="mbtn ${ex.done.has(it.id)?"gone":""}" data-ml="${it.id}" aria-pressed="${ex.sel===it.id}"><span class="deva">${esc(H(it))}</span>${!rd&&showRom(it)==="show"?`<small>${esc(R(it))}</small>`:""}</button>`).join("")}</div>
      <div class="col">${ex.right.map(it=>`<button class="mbtn ${ex.done.has(it.id)?"gone":""}" data-mr="${it.id}">${esc(it.en)}</button>`).join("")}</div></div>`]; }

}
function gymParts(ex){

function clockParts(ex){

function distractors(it, n, field){
  const u=UNIT_OF[it.id];
  const val=x=> field==="en"? x.en : H(x);
  const own=new Set([val(it)]);
  let pool=shuffle(u.items.filter(x=>x!==it));
  const others=shuffle(UNITS.filter(x=>x.track===u.track && x!==u).flatMap(x=>x.items));
  pool=pool.concat(others);
  const out=[];
  for(const x of pool){ if(SAME[it.id]===x.id) continue; const v=val(x); if(own.has(v)) continue; own.add(v); out.push(x); if(out.length>=n) break; }
  return out;
}
const tok = s=>stripP(s).split(" ").filter(Boolean);
const romTok = s=>s.replace(/[?!.,]/g,"").replace(/\s+/g," ").trim().split(" ").filter(Boolean);
function canBuild(it){ return !it.cloze && UNIT_OF[it.id].track==="speak" && tok(H(it)).length>=2 && tok(H(it)).length===romTok(R(it)).length; }
function exFor(it, forceEasy){
  if(it.cloze) return mkEx("cloze", it);
  const b=box(it), read=UNIT_OF[it.id].track==="read", au=hasAudio()&&!read;
  let types;
  if(forceEasy) types=["pick_en"];
  else if(read) types = b<=1? ["pick_en","pick_hi"] : ["pick_hi","pick_en","type_read","type_read"];
  else if(b<=1) types=["pick_en","pick_hi"].concat(au?["listen"]:[]);
  else if(b===2) types=["pick_hi","type","speak"].concat(au?["listen"]:[]).concat(canBuild(it)?["build","build"]:[]);
  else types=["type","type","speak","speak"].concat(canBuild(it)?["build"]:[]).concat(au?["listen","dictate","dictate"]:[]);
  return mkEx(pickOne(types), it);
}
function mkEx(t, it){
  const ex={t, it, sel:null};
  if(t==="pick_en"||t==="pick_hi"||t==="listen"){
    const field = t==="pick_en" ? "en" : "hi";
    ex.opts = shuffle([it].concat(distractors(it,3,field)));
  }
  if(t==="cloze"){ ex.opts = shuffle([it.ans].concat(it.wrong)).map((o,i)=>({id:"c"+i, hi:o[0], rom:o[1], ok:o===it.ans})); }
  if(t==="build"){
    const words=tok(H(it)), roms=romTok(R(it));
    const extra=distractors(it,5,"hi").flatMap(x=>{ const w=tok(H(x)), r=romTok(R(x)); return w.length===r.length? w.map((ww,i)=>({w:ww,r:r[i]})):[]; });
    const seen=new Set(words), uniq=[];
    for(const x of shuffle(extra)){ if(!seen.has(x.w)){ seen.add(x.w); uniq.push(x); } if(uniq.length>=Math.min(3,Math.max(2,6-words.length))) break; }
    ex.tiles=shuffle(words.map((w,i)=>({w,r:roms[i]})).concat(uniq)).map((x,i)=>Object.assign({k:i},x));
    ex.placed=[];
  }
  if(t==="type"||t==="type_read"||t==="dictate") ex.val="";
  if(t==="speak") ex.revealed=false;
  return ex;
}
function mkMatch(items){
  const pick=shuffle(items.filter(i=>!i.cloze)).slice(0,5);
  return {t:"match", items:pick, left:shuffle(pick), right:shuffle(pick), done:new Set(), sel:null, mistakes:0};
}

/* --- answer checking ------------------------------------------------- */
function stripP(s){ return s.replace(/[?!.,।]/g,"").replace(/\s+/g," ").trim(); }
function normDeva(s){ return stripP(s.normalize("NFC").normalize("NFD").replace(/़/g,"").replace(/ँ/g,"ं").normalize("NFC")); }
// Common spelling variants map to one form (applied to normalized words)
const EQUIV = [["main","mai","mein","mei","me"],["nahin","nahi","nai","nhi","nahn"],["han","ha"],["hun","hu","hum_"],["kahan","kaha"],
  ["tumhein","tumhe","tumhen","tumein"],["hain","hein","hen"],["hai","he","hae"],["voh","vo","vah","vh"],["kion","kiun","kiu","kio"],
  ["bahut","bohot","bhut","bahot","bohat","bht"],["meri","mery"],["tum","tm"],["kia","ka_"]];
const EQ = {}; EQUIV.forEach(g=>g.forEach(w=>{ if(!w.endsWith("_")) EQ[w]=g[0]; }));
function normWord(w){
  w=w.replace(/(c+h*)+/g,"ch").replace(/ey$/,"e").replace(/f/g,"ph")
     .replace(/([kgjtdpbs])h/g,"$1").replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u")
     .replace(/w/g,"v").replace(/z/g,"j").replace(/y/g,"i").replace(/(\w)\1+/g,"$1");
  return EQ[w]||w;
}
function normRom(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim().split(" ").filter(Boolean).map(normWord); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()]; for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c;} return p[n]; }
// Returns number of tolerated typos, or null if the words don't match.
function wordsMatch(a,b){
  if(a.length!==b.length) return null;
  let typos=0;
  for(let i=0;i<a.length;i++){ const x=a[i], y=b[i]; if(x===y) continue;
    // Only forgive a one-letter slip in a longer word, never at the start or in a gender/number ending
    if(y.length>=5 && x[0]===y[0] && x.slice(-2)===y.slice(-2) && lev(x,y)<=1){ typos++; continue; }
    return null; }
  return typos;
}
function checkTyped(val, it){
  const v=val.trim(); if(!v) return {ok:false};
  if(/[ऀ-ॿ]/.test(v)) return {ok: normDeva(v)===normDeva(H(it))};
  const a=normRom(v);
  if(it.romF){
    const other = female()? it.rom : it.romF;
    if(normRom(other).join(" ")===a.join(" ")) return {ok:false, msg:`That's how a ${female()?"man":"woman"} says it. As a ${female()?"woman":"man"} you'd use the ${female()?"-i (karti, rahi, gayi)":"-a (karta, raha, gaya)"} ending.`};
  }
  let best=null;
  for(const t of [R(it)].concat(it.alt||[])){ const r=wordsMatch(a, normRom(t)); if(r!==null && (best===null||r<best)) best=r; }
  if(best===null) return {ok:false};
  if(best > (a.length>=5?2:1)) return {ok:false};
  return {ok:true, typo:best>0};
}
function grade(ex){
  const it=ex.it;
  if(ex.t==="pick_en"||ex.t==="pick_hi"||ex.t==="listen") return {ok: ex.sel===it.id};
  if(ex.t==="cloze"){ const o=ex.opts.find(o=>o.id===ex.sel); return {ok: !!(o&&o.ok)}; }
  if(ex.t==="build") return {ok: ex.placed.map(k=>ex.tiles[k].w).join(" ")===tok(H(it)).join(" ")};
  if(ex.t==="type"||ex.t==="type_read"||ex.t==="dictate") return checkTyped(ex.val, it);
  if(ex.t==="clock") return {ok: ex.sel===ex.ans};
  if(ex.t==="gym") return ex.mode==="mc"? {ok: !!(ex.opts.find(o=>o.id===ex.sel)||{}).ok} : checkTyped(ex.val, it);
  if(ex.t==="num") return ex.mode==="pick"? {ok: +ex.sel===ex.n} : {ok: parseInt(ex.val.replace(/[^0-9]/g,""),10)===ex.n};
  return {ok:true};
}

   SESSIONS (lessons, reviews, scenes)
   ============================================================ */
function startLesson(unitId){
  const u=UNITS.find(x=>x.id===unitId);
  const unseen=u.items.filter(i=>!S.items[i.id]);
  const seen=shuffle(u.items.filter(i=>S.items[i.id])).sort((a,b)=>box(a)-box(b));
  const fresh=unseen.slice(0,4);
  const old=seen.slice(0, Math.max(3, 8-fresh.length*2));
  const q=[];
  for(let i=0;i<fresh.length;i+=2){
    const pair=fresh.slice(i,i+2);
    pair.forEach(it=>q.push({t:"intro",it}));
    pair.forEach(it=>q.push(mkEx("pick_en",it)));
  }
  const mid=[];
  old.forEach(it=>mid.push(exFor(it)));
  const read=u.track==="read";
  fresh.forEach(it=>mid.push(mkEx(read?"pick_hi":pickOne(["pick_hi"].concat(hasAudio()?["listen"]:[])),it)));
  // Grammar drills: unseen first, then weakest
  const drills=shuffle(u.drills).sort((a,b)=>(S.items[a.id]?1:0)-(S.items[b.id]?1:0) || box(a)-box(b)).slice(0,2);
  drills.forEach(d=>mid.push(mkEx("cloze",d)));
  const pool=fresh.concat(old);
  const midS=shuffle(mid);
  if(pool.length>=4) midS.splice(Math.floor(midS.length/2),0,mkMatch(pool));
  q.push(...midS);
  // Finish by producing the new items: type/build, or type the sound for reading
  fresh.slice(0,2).forEach(it=>q.push(mkEx(read?"type_read":(canBuild(it)?"build":"type"),it)));
  if(!read && fresh.length) q.push(mkEx("speak", fresh[fresh.length-1]));
  beginSession({kind:"lesson", unit:u, queue:q});
  if(!S.tipsSeen[u.id]){ S.tipsSeen[u.id]=1; save(); showTip(u.id); }
}
function startReview(weak){
  let items;
  if(weak){ items=Object.keys(S.items).filter(id=>ITEM[id]&&S.items[id].b>=1).map(id=>ITEM[id]).sort((a,b)=>box(a)-box(b)||S.items[b.id].w-S.items[a.id].w).slice(0,10); }
  else items=dueItems().sort((a,b)=>S.items[a.id].d-S.items[b.id].d).slice(0,15);
  if(!items.length) return;
  const q=shuffle(items).map(it=>exFor(it));
  if(items.filter(i=>!i.cloze).length>=5) q.splice(Math.floor(q.length/2),0,mkMatch(items));
  beginSession({kind:"review", queue:q});
}
function startScene(id){
  const sc=SCENES.find(x=>x.id===id);
  const q=[{t:"scene_intro", sc}].concat(sc.steps.map(st=> st.ask? {t:"ask", st, sel:null, tried:new Set()} : {t:"line", st}));
  beginSession({kind:"scene", scene:sc, queue:q});
}
function beginSession(o){
  view.returnTo = (o.kind==="lesson"||o.kind==="review") ? "home" : (o.kind==="story"||o.kind==="gym") ? "practice" : (view.name||"home");
  session=Object.assign({i:0, combo:0, maxCombo:0, correct:0, graded:0, results:{}, state:"answer", feedback:null, pct:0, spoken:0}, o);
  renderSession(true);
}

function canCheck(ex){
  if(ex.t==="intro"||ex.t==="line"||ex.t==="scene_intro") return true;
  if(ex.t==="match") return ex.done.size===ex.items.length;
  if(ex.t==="type"||ex.t==="type_read"||ex.t==="dictate") return ex.val.trim().length>0;
  if(ex.t==="build") return ex.placed.length>0;
  if(ex.t==="ask") return ex.sel!==null;
  if(ex.t==="speak") return false;
  if(ex.t==="clock") return !!ex.sel;
  if(ex.t==="gym"||ex.t==="num") return (ex.mode==="mc"||ex.mode==="pick")? !!ex.sel : ex.val.trim().length>0;
  return !!ex.sel;
}

function autoSay(ex){
  if(!hasAudio()||!ex) return;
  if(ex.t==="line") return say(H(ex.st));
  if(!ex.it) return;
  if(ex.t==="intro"||ex.t==="listen"||ex.t==="pick_en"||ex.t==="dictate"||(ex.t==="num"&&ex.mode==="listen")) say(H(ex.it));
}
function requeue(ex){
  const s=session, it=ex.it;
  if(ex.t==="gym"||ex.t==="num"||ex.t==="clock"){ s.queue.splice(Math.min(s.queue.length, s.i+4), 0, Object.assign({}, ex, {sel:null, val:""})); return; }
  const read=UNIT_OF[it.id].track==="read";
  let re;
  if(ex.t==="type"||ex.t==="build"||ex.t==="type_read"||ex.t==="speak"||ex.t==="cloze"||ex.t==="dictate") re=mkEx(ex.t,it);
  else re=mkEx(ex.t==="pick_en"?"pick_hi":"pick_en", it);
  if(read && re.t==="listen") re=mkEx("pick_en",it);
  s.queue.splice(Math.min(s.queue.length, s.i+4), 0, re);
}
function submit(skip, forced){
  const s=session, ex=s.queue[s.i];
  if(ex.t==="intro"||ex.t==="line"||ex.t==="scene_intro"){ advance(); return; }
  if(ex.t==="ask"){
    const o=ex.st.opts[ex.sel]; const ok=!!o.ok;
    if(ex.tried.size===0){ s.graded++; if(ok) s.correct++; }
    if(ok){ s.combo++; s.maxCombo=Math.max(s.maxCombo,s.combo); } else { s.combo=0; ex.tried.add(ex.sel); }
    s.feedback={ok}; s.state="feedback"; renderSession(); announce(ok?"Correct. "+o.why:"Not quite. "+o.why);
    if(ok && !o.plain) say(H(o));
    return;
  }
  const r = forced || (skip? {ok:false} : grade(ex));
  s.feedback=r; s.state="feedback";
  record(ex.it, r.ok);
  if(ex.t==="speak"){ s.spoken++; }
  if(r.ok){ s.combo++; s.maxCombo=Math.max(s.maxCombo,s.combo); }
  else { s.combo=0; requeue(ex); }
  try{ navigator.vibrate && navigator.vibrate(r.ok?12:[24,40,24]); }catch(e){}
  renderSession();
  announce((r.ok?"Correct. ":"Not quite. The answer is ")+R(ex.it)+", "+(ex.it.en));
  if(ex.t!=="speak") say(H(ex.it));
}
function record(it, ok){
  const s=session;
  if(!s.results[it.id]) s.results[it.id]={wrong:0};
  if(!ok) s.results[it.id].wrong++;
  s.graded++; if(ok) s.correct++;
}
function advanceNow(){
  stopDict();
  const s=session, ex=s.queue[s.i];
  if(ex && ex.t==="ask" && s.state==="feedback" && !s.feedback.ok){ ex.sel=null; s.state="answer"; s.feedback=null; renderSession(true); return; }
  s.i++; s.state="answer"; s.feedback=null;
  if(s.i>=s.queue.length) return finish();
  renderSession(true);
  if(s._preSaid) s._preSaid=false; else autoSay(s.queue[s.i]);
}

function finish(){
  const s=session, now=Date.now();
  let strengthened=0, newly=0, xp; const bloomIds=[], newIds=[]; let newest=null;
  if(s.kind==="story"){
    const pct = s.graded? Math.round(s.correct/s.graded*100) : 100;
    xp = 10 + s.correct*4;
    S.stories[s.story.id]=Math.max(S.stories[s.story.id]||0, pct);
    S.stats.stories++;
  } else if(s.kind==="scene"){
    const pct = s.graded? Math.round(s.correct/s.graded*100) : 100;
    xp = 10 + s.correct*3 + (pct===100?5:0);
    S.scenes[s.scene.id]=Math.max(S.scenes[s.scene.id]||0, pct);
    S.stats.scenes++;
  } else {
    // Spaced repetition: an item moves up one box only when it was due (or new).
    // Extra practice before it's due earns XP but doesn't inflate its strength.
    Object.keys(s.results).forEach(id=>{
      if(!ITEM[id]) return;
      const r=s.results[id], rec=S.items[id]||{b:0,d:0,c:0,w:0};
      const was=rec.b, due = was===0 || rec.d <= now + 2*HOUR;
      if(r.wrong===0){ if(due){ rec.b=Math.min(5,rec.b+1); rec.d=now+INTERVALS[rec.b]; } rec.c++; }
      else { rec.b=Math.max(1,rec.b-2); rec.w+=r.wrong; rec.d=now+HOUR; }
      S.items[id]=rec;
      if(rec.b>was && was>0) strengthened++;
      if(was===0) newly++;
      if(rec.b>was){ bloomIds.push(id); if(was===0){ newIds.push(id); if(isWord(id) && UNIT_OF[id] && UNIT_OF[id].track==="speak") newest=id; } }
    });
    const clean=Object.values(s.results).filter(r=>r.wrong===0).length;
    xp = 5 + clean*2 + Math.floor(s.maxCombo/5)*3 + (s.graded>=5 && s.correct===s.graded?10:0);
    if(s.kind==="lesson"){ S.stats.lessons++; S.units[s.unit.id]=Math.min(3,(S.units[s.unit.id]||0)+1); }
    else if(s.kind==="review") S.stats.reviews++;
    else if(s.kind==="gym") S.stats.gym=(S.stats.gym||0)+1;
  }
  const acc = s.graded? s.correct/s.graded : 1;
  const perfect = s.graded>=5 && s.correct===s.graded;
  const goalBefore = todayXP()>=S.settings.goal;
  S.xp+=xp; const k=dayKey(); S.days[k]=(S.days[k]||0)+xp;
  S.act[k]=S.act[k]||{it:0,se:0}; S.act[k].it+=s.graded; S.act[k].se++;
  const cutoff=dayKey(now-120*DAY); Object.keys(S.days).forEach(d=>{ if(d<cutoff) delete S.days[d]; }); Object.keys(S.act).forEach(d=>{ if(d<cutoff) delete S.act[d]; });
  if(perfect) S.stats.perfect++;
  S.stats.spoken+=s.spoken;
  S.stats.bestCombo=Math.max(S.stats.bestCombo,s.maxCombo);
  const newAch = checkAch(perfect);
  save();
  const goalNow = todayXP()>=S.settings.goal;
  const res={xp, acc, maxCombo:s.maxCombo, strengthened, newly, newAch, goalHit:!goalBefore&&goalNow, kind:s.kind, unit:s.unit, scene:s.scene, story:s.story};
  session=null;
  const rgSet=new Set(rgItems().map(i=>i.id)), rgBloom=bloomIds.filter(id=>rgSet.has(id));   // only rangoli phrases bloom (not letters or drills)
  res.rgNew=newIds.filter(id=>rgSet.has(id)).length;
  view.bloom = rgBloom.length ? rgBloom : null; if(newest) view.newest=newest;
  view.name = view.returnTo || "home";
  showResult(res);
}
function checkAch(perfect){
  const got=[]; const give=id=>{ if(!S.ach[id]){ S.ach[id]=Date.now(); got.push(id);} };
  if(S.stats.lessons>=1) give("first");
  if(perfect) give("perfect");
  if(S.stats.bestCombo>=10) give("combo10");
  if(learned(ITEM.l1)) give("love");
  if((S.units.family||0)>=3) give("family");
  if(Object.keys(S.scenes).length>=1) give("scene1");
  if(SCENES.every(sc=>S.scenes[sc.id])) give("scenes");
  if(Object.keys(S.items).filter(id=>ITEM[id]&&ITEM[id].cloze&&S.items[id].b>=1).length>=15) give("grammar");
  if(S.stats.spoken>=20) give("speaker");
  const wc=wordCount(); if(wc>=25) give("words25"); if(wc>=100) give("words100"); if(wc>=200) give("words200");
  if(UNITS.filter(u=>u.track==="read").every(u=>(S.units[u.id]||0)>=3)) give("reader");
  if(S.stats.reviews>=5) give("review5");
  if(Object.keys(S.items).filter(id=>S.items[id].b>=4).length>=20) give("mastery");
  if(Object.keys(S.stories).length>=1) give("story1");
  if(STORIES.every(x=>S.stories[x.id])) give("stories");
  if(S.stats.chats>=10) give("chat10");
  if(Object.keys(S.custom).length>=10) give("mywords");
  const ms=myStage(); if(ms>=2) give("stage2"); if(ms>=3) give("stage3"); if(ms>=4) give("stage4"); if(ms>=5) give("stage5"); if((S.stats.gym||0)>=10) give("gym10");
  const st=streak(); if(st>=3) give("streak3"); if(st>=7) give("streak7"); if(st>=30) give("streak30");
  return got;
}

   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act],[data-nav],[data-track],[data-start],[data-scene],[data-unit],[data-story],[data-saveline],[data-saveword],[data-talk],[data-copy],[data-gymt],[data-numr],[data-tip],[data-opt],[data-ask],[data-saytext],[data-say],[data-place],[data-unplace],[data-ml],[data-mr],[data-filter],[data-reveal]");
  if(!t) return;
  if(t.classList.contains("scrim") && e.target.closest("[data-stop]")) return;   // taps inside a sheet don't close it; its X and buttons do
  const d=t.dataset;
  if(d.reveal!==undefined){ t.classList.remove("hid"); t.removeAttribute("role"); t.removeAttribute("tabindex"); t.removeAttribute("aria-label"); return; }
  if(d.saytext!==undefined){ say(d.saytext, !!d.slow); return; }
  if(d.say){ say(H(ITEM[d.say])); return; }
  if(d.nav){ if(d.nav===view.name && !session){ window.scrollTo({top:0,behavior:RM()?"auto":"smooth"}); return; } view.name=d.nav; render(); window.scrollTo(0,0); if(d.nav==="path") scrollToNext(); return; }
  if(d.track){ view.track=d.track; try{localStorage.setItem("dilse-track",d.track);}catch(e){} render(); return; }
  if(d.unit){ unitSheet(d.unit); return; }
  if(d.start){ closeModal(true); startLesson(d.start); if(!modalOpen()) autoSay(session.queue[0]); return; }
  if(d.scene){ startScene(d.scene); return; }
  if(d.story){ const st=STORIES.find(x=>x.id===d.story); view.name="story"; view.story=d.story; view.storyRom=(st.level==="A1"||st.level==="A2"); render(); window.scrollTo(0,0); return; }
  if(d.saveline!==undefined){ const st=STORIES.find(x=>x.id===view.story); const l=st&&st.lines[+d.saveline]; if(l) addCustom(l[0],l[1],l[2]); return; }
  if(d.saveword){ try{ const w=JSON.parse(d.saveword); addCustom(w.hi,w.rom,w.en); }catch(err){} return; }
  if(d.copy!==undefined){ const n=NOTES[+d.copy]; const txt=H(n)+"\n\n"+R(n);
    const fail=()=>toast("Couldn't copy here. Long-press the text to copy it.");
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied. Paste it into your chat with her."), fail); }catch(err){ fail(); } return; }
  if(d.gymt){ view.gymT.has(d.gymt)? view.gymT.delete(d.gymt) : view.gymT.add(d.gymt); render(); return; }
  if(d.numr){ view.numR=d.numr; render(); return; }
  if(d.talk){ if(Talk.busy) return; Talk.scen=d.talk; talkReset(); if(view.name!=="talk"){ view.name="talk"; render(); window.scrollTo(0,0); } else render(); return; }
  if(d.tip){ showTip(d.tip); return; }
  if(d.filter){ view.filter=d.filter; render(); return; }
  const s=session;
  if(s){
    const ex=s.queue[s.i];
    if(d.opt && s.state==="answer"){ ex.sel=d.opt; renderSession(); if(ex.t==="pick_hi" && UNIT_OF[d.opt] && UNIT_OF[d.opt].track==="speak") say(H(ITEM[d.opt])); return; }
    if(d.ask!==undefined && s.state==="answer"){ const i=+d.ask; if(!ex.tried.has(i)){ ex.sel=i; renderSession(); if(!ex.st.opts[i].plain) say(H(ex.st.opts[i])); } return; }
    if(d.place && s.state==="answer"){ const k=+d.place; if(!ex.placed.includes(k)){ ex.placed.push(k); say(ex.tiles[k].w); } renderSession(); return; }
    if(d.unplace && s.state==="answer"){ const k=+d.unplace; ex.placed=ex.placed.filter(x=>x!==k); renderSession(); return; }
    if(d.ml){ if(!ex.done.has(d.ml)){ ex.sel=d.ml; say(H(ITEM[d.ml])); renderSession(); } return; }
    if(d.mr){
      if(!ex.sel) { toast("Pick a Hindi word on the left first"); return; }
      if(d.mr===ex.sel){ ex.done.add(d.mr); ex.sel=null;
        if(ex.done.size===ex.items.length){ if(!ex.mistakes){ s.combo++; s.maxCombo=Math.max(s.maxCombo,s.combo); } s.state="feedback"; s.feedback={ok:true}; renderSession(); announce("All pairs matched"); return; }
        renderSession(); const nx=$('[data-ml]:not(.gone)'); if(nx) nx.focus(); }
      else { ex.mistakes++; s.combo=0; const r=s.results[ex.sel]||(s.results[ex.sel]={wrong:0}); r.wrong++;
        renderSession(); const b=document.querySelector(`[data-mr="${CSS.escape(d.mr)}"]`); if(b) b.classList.add("shake"); announce("Not a pair"); }
      return;
    }
  }
  switch(d.act){
    case "check": if(s && canCheck(s.queue[s.i])) submit(false); break;
    case "hideinstall": try{ localStorage.setItem("dilse-install-hidden","1"); }catch(err){} render(); break;
    case "exportp": { let code=""; try{ code=btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(err){}
      const fail=()=>{ const t=$("#importp"); if(t){ t.value=code; t.select(); } toast("Couldn't copy here. The code is selected in the box below; copy it from there."); };
      try{ navigator.clipboard.writeText(code).then(()=>toast("Progress code copied"), fail); }catch(err){ fail(); } } break;
    case "importp": { const t=$("#importp"); const raw=(t&&t.value||"").trim(); if(!raw){ toast("Paste a progress code first"); break; }
      try{ const other=JSON.parse(decodeURIComponent(escape(atob(raw)))); if(!other||typeof other!=="object"||!other.items) throw 0;
        S=mergeStates(S,other); S.updatedAt=Date.now(); registerCustom(); save(); render(); toast("Progress merged"); }
      catch(err){ toast("That code didn't work. Copy it again from the other app and paste the whole thing."); } } break;
    case "mic": if(Dict.listening) stopDict(); else startDict(s?"speak":"talk"); break;
    case "playall": { const st=STORIES.find(x=>x.id===view.story); if(st) sayAll(st.lines.map(l=>l[0])); } break;
    case "togrom": view.storyRom=!view.storyRom; render(); break;
    case "storyquiz": startStoryQuiz(view.story); break;
    case "verbgym": startVerbGym(); break;
    case "timegym": startTimeGym(); break;
    case "numgym": startNumGym(); if(session) autoSay(session.queue[0]); break;
    case "hint": talkHint(); break;
    case "usehint": if(Talk.hint){ Talk.draft=Talk.hint.rom||Talk.hint.hi; Talk.hint=null; render(); const i=$("#talk-in"); if(i) i.focus(); } break;
    case "newtalk": if(!Talk.busy){ talkReset(); render(); } break;
    case "skip": if(s) submit(true); break;
    case "reveal": if(s){ const ex=s.queue[s.i]; ex.revealed=true; renderSession(); say(H(ex.it)); const y=$('[data-act="selfyes"]'); if(y) y.focus(); } break;
    case "selfyes": if(s) submit(false,{ok:true}); break;
    case "selfno": if(s) submit(false,{ok:false}); break;
    case "nolisten": if(s && s.queue[s.i].t==="num"){ s.queue[s.i].mode="read"; renderSession(); break; }
      if(s){ const ex=s.queue[s.i]; Object.assign(ex, mkEx(ex.t==="dictate"?"type":"pick_hi", ex.it)); ex.sel=null; renderSession(); } break;
    case "next": if(s) advance(); break;
    case "quit": confirmSheet(s&&s.kind==="scene"?"Leave this conversation?":"Leave this lesson?","Progress in this session won't be saved. Everything you've learned before stays safe.","Leave",()=>{ session=null; render(); }); break;
    case "review": startReview(false); if(session) autoSay(session.queue[0]); else render(); break;
    case "weak": startReview(true); if(session) autoSay(session.queue[0]); break;
    case "home": document.querySelectorAll("canvas.powder").forEach(c=>c.remove()); setTimeout(()=>{ if(view.name==="path"&&!session) scrollToNext(); },0); closeModal(true); render(); window.scrollTo(0,0); break;
    case "closemodal": closeModal(); break;
    case "allnotes": view.allNotes=true; render(); break;
    case "copynote": { const n=NOTES[noteOfDay()]; const txt=H(n)+"\n\n"+R(n);
      const fail=()=>toast("Couldn't copy here. Open Practice, Love notes, and long-press the text.");
      try{ navigator.clipboard.writeText(txt).then(()=>toast("Tonight's note is copied. Paste it into your chat."), fail); }catch(err){ fail(); } } break;
    case "reset": confirmSheet("Reset all progress?","This erases your XP, streak, learned words and achievements everywhere. It can't be undone.","Erase everything",()=>{ const keep=S.settings, ka=S.settingsAt; S=freshState(); S.settings=keep; S.settingsAt=ka; S.resetAt=Date.now(); registerCustom(); save(); render(); toast("Progress reset"); }); break;
  }
});
function updateBook(){ const l=$("#book-list"); if(l) l.innerHTML=bookList(); }
document.addEventListener("input", e=>{
  if((e.target.id==="type-in") && session){ const ex=session.queue[session.i]; ex.val=e.target.value; const b=$('[data-act="check"]'); if(b) b.disabled=!canCheck(ex); }
  if(e.target.id==="book-search"){ view.q=e.target.value; if(!e.isComposing) updateBook(); }
  if(e.target.id==="talk-in"){ Talk.draft=e.target.value; }
  if(e.target.id==="set-name"){ S.settings.name=e.target.value.slice(0,30); S.settingsAt=Date.now(); save(); }
});
document.addEventListener("submit", e=>{ if(e.target.id==="talk-form"){ e.preventDefault(); talkSend(); } });
document.addEventListener("compositionend", e=>{ if(e.target.id==="book-search"){ view.q=e.target.value; updateBook(); } });
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="set-gender"){ S.settings.gender=e.target.value; S.settingsAt=Date.now(); save(); render(); const g=$("#set-gender"); if(g) g.focus(); toast(e.target.value==="f"?"Using feminine forms (karti hoon)":"Using masculine forms (karta hoon)"); }
  if(id==="set-sound"){ S.settings.sound=e.target.checked; S.settingsAt=Date.now(); save(); if(e.target.checked) chime("ok"); }
  if(id==="set-rom"){ S.settings.rom=e.target.value; S.settingsAt=Date.now(); save(); }
  if(id==="set-goal"){ S.settings.goal=+e.target.value; S.settingsAt=Date.now(); save(); render(); const g=$("#set-goal"); if(g) g.focus(); }
});
document.addEventListener("keydown", e=>{
  if(modalOpen()){
    if(e.key==="Escape"){ e.preventDefault(); closeModal(); }
    return;
  }
  const rv = e.target.closest && e.target.closest("[data-reveal]");
  if(rv && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); rv.click(); return; }
  const s=session; if(!s) return;
  if(e.repeat) return;
  const ex=s.queue[s.i];
  if(e.key==="Enter"){
    if(e.target.closest && e.target.closest("button") ) return;
    e.preventDefault();
    if(s.state==="feedback"||ex.t==="intro"||ex.t==="line"||ex.t==="scene_intro") advance();
    else if(canCheck(ex)) submit(false);
    return;
  }
  if(s.state==="answer" && /^[1-4]$/.test(e.key) && e.target.id!=="type-in"){
    const i=+e.key-1;
    if(ex.opts && ex.opts[i]){ ex.sel=ex.opts[i].id; renderSession(); }
    else if(ex.t==="ask" && ex.st.opts[i] && !ex.tried.has(i)){ ex.sel=i; renderSession(); }
  }
});
