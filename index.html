<style>
/* Gulal: an iOS app shell coloured by Holi pigment. One powder field opens each screen; quiet native rows below; progress drawn as rangoli dots. */
:root{
  --ground:#F7F5FB; --surface:#FFFFFF; --surface-2:#F0EDF7; --sunk:rgba(26,20,51,.06);
  --ink:#1A1433; --ink-2:#5B5573; --ink-3:#7E789A; --hair:rgba(26,20,51,.12);
  --glass:rgba(249,248,253,.74); --glass-line:rgba(26,20,51,.10); --scrim:rgba(20,15,40,.38);
  --rani:#E0157A; --kesari:#FF8B1F; --mor:#10A5A8; --neel:#5546E8; --haldi:#FFC62E; --hara:#2FA85A; --laal:#E23B3B;
  --jamuni:#8F2FD6; --jamuni-t:#7322B5; --rani-t:#B80F63; --kesari-t:#A65200; --mor-t:#047A7D; --neel-t:#3F31C9; --haldi-t:#8A6100; --hara-t:#1C7A3F; --laal-t:#C42B2B;
  --act:#D0106F; --on-act:#FFFFFF; --act-soft:rgba(208,16,111,.10);
  --good:#1C7A3F; --good-soft:rgba(47,168,90,.14); --bad:#C42B2B; --bad-soft:rgba(226,59,59,.12);
  --dot-off:rgba(26,20,51,.22); --line-art:rgba(26,20,51,.10);
  --lift:0 1px 2px rgba(26,20,51,.06),0 10px 28px -14px rgba(26,20,51,.30);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Noto Sans Devanagari","Kohinoor Devanagari",sans-serif;
  --f-display:"Eczar","Kohinoor Devanagari","Noto Sans Devanagari",Georgia,serif;
  --r-card:16px; --r-field:26px; --ease:cubic-bezier(.16,1,.3,1);
  --today-base:#FFFFFF; --today-ink:#1A1433; --today-ink-2:#5B5573;
  --on-rani:#FFFFFF; --on-kesari:#14102B; --on-mor:#14102B; --on-neel:#FFFFFF; --on-haldi:#14102B; --on-hara:#14102B; --on-jamuni:#FFFFFF;
  --good-btn:#1C7A3F; --bad-btn:#C42B2B; --on-verdict:#FFFFFF; --badge-bg:#D42A2A; --badge-ink:#FFFFFF; --tab-on:#B80F63; --today-tint:7%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#15102E; --surface:#201A42; --surface-2:#2A2352; --sunk:rgba(245,242,255,.07);
  --ink:#F5F2FF; --ink-2:#BDB6DB; --ink-3:#958EB8; --hair:rgba(245,242,255,.13);
  --glass:rgba(27,21,58,.70); --glass-line:rgba(245,242,255,.12); --scrim:rgba(6,4,16,.6);
  --rani:#FF4FA0; --kesari:#FFA040; --mor:#2ED3C9; --neel:#8E82FF; --haldi:#FFD35C; --hara:#4FD483; --laal:#FF6B6B;
  --jamuni:#C17BFF; --jamuni-t:#D3A1FF; --rani-t:#FF7AB8; --kesari-t:#FFB46B; --mor-t:#5EE3DA; --neel-t:#ADA4FF; --haldi-t:#FFDD85; --hara-t:#7BE3A3; --laal-t:#FF8F8F;
  --act:#D9187A; --on-act:#FFFFFF; --act-soft:rgba(255,79,160,.16);
  --good:#7BE3A3; --good-soft:rgba(79,212,131,.16); --bad:#FF8F8F; --bad-soft:rgba(255,107,107,.16);
  --dot-off:rgba(245,242,255,.24); --line-art:rgba(245,242,255,.12);
  --lift:none; --today-base:#1D1644; --today-ink:#F5F2FF; --today-ink-2:#CFC8EE; color-scheme:dark;
  --on-rani:#14102B; --on-kesari:#14102B; --on-mor:#14102B; --on-neel:#14102B; --on-haldi:#14102B; --on-hara:#14102B; --on-jamuni:#14102B;
  --good-btn:#4FD483; --bad-btn:#FF6B6B; --on-verdict:#14102B; --badge-bg:#FF6B6B; --badge-ink:#14102B; --tab-on:#FFB3D7; --today-tint:10%;}}
:root[data-theme="dark"]{
  --ground:#15102E; --surface:#201A42; --surface-2:#2A2352; --sunk:rgba(245,242,255,.07);
  --ink:#F5F2FF; --ink-2:#BDB6DB; --ink-3:#958EB8; --hair:rgba(245,242,255,.13);
  --glass:rgba(27,21,58,.70); --glass-line:rgba(245,242,255,.12); --scrim:rgba(6,4,16,.6);
  --rani:#FF4FA0; --kesari:#FFA040; --mor:#2ED3C9; --neel:#8E82FF; --haldi:#FFD35C; --hara:#4FD483; --laal:#FF6B6B;
  --jamuni:#C17BFF; --jamuni-t:#D3A1FF; --rani-t:#FF7AB8; --kesari-t:#FFB46B; --mor-t:#5EE3DA; --neel-t:#ADA4FF; --haldi-t:#FFDD85; --hara-t:#7BE3A3; --laal-t:#FF8F8F;
  --act:#D9187A; --on-act:#FFFFFF; --act-soft:rgba(255,79,160,.16);
  --good:#7BE3A3; --good-soft:rgba(79,212,131,.16); --bad:#FF8F8F; --bad-soft:rgba(255,107,107,.16);
  --dot-off:rgba(245,242,255,.24); --line-art:rgba(245,242,255,.12);
  --lift:none; --today-base:#1D1644; --today-ink:#F5F2FF; --today-ink-2:#CFC8EE; color-scheme:dark;
  --on-rani:#14102B; --on-kesari:#14102B; --on-mor:#14102B; --on-neel:#14102B; --on-haldi:#14102B; --on-hara:#14102B; --on-jamuni:#14102B;
  --good-btn:#4FD483; --bad-btn:#FF6B6B; --on-verdict:#14102B; --badge-bg:#FF6B6B; --badge-ink:#14102B; --tab-on:#FFB3D7; --today-tint:10%;}

/* ---------- base + browser surfaces ---------- */
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;caret-color:var(--rani);accent-color:var(--act)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
::selection{background:color-mix(in srgb,var(--rani) 30%,transparent);color:inherit}
html{scrollbar-color:color-mix(in srgb,var(--ink) 28%,transparent) transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
a{color:var(--rani-t);text-underline-offset:3px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--rani) 70%,transparent);outline-offset:3px;border-radius:12px}
.deva{font-family:var(--f-display);font-weight:600;line-height:1.35}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:22px;height:22px;flex:none;display:block}
.muted{color:var(--ink-2)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- ambient haze: the current screen's pigment spilling into the ground ---------- */
.haze{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.haze i{position:absolute;border-radius:50%;width:120vmax;height:120vmax;left:50%;top:-70vmax;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--haze,var(--rani)) 26%,transparent),transparent 70%);transition:background .6s var(--ease)}
.haze i+i{width:80vmax;height:80vmax;top:-44vmax;left:8%;background:radial-gradient(closest-side,color-mix(in srgb,var(--haze2,var(--kesari)) 20%,transparent),transparent 70%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .haze i{opacity:.9}}

/* ---------- app column ---------- */
#app{position:relative;z-index:1}
.page{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 108px}

/* compact bar (appears once the large title scrolls away) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));min-height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;border-bottom:.5px solid transparent;transition:background .25s,border-color .25s}
body.scrolled .bar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-color:var(--glass-line)}
.bar-title{font-weight:600;font-size:1rem;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
body.scrolled .bar-title{opacity:1;transform:none}
.bar-l{justify-self:start;display:flex;align-items:center}
.bar-r{justify-self:end;display:flex;align-items:center;gap:6px}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--rani-t);font-weight:500;font-size:1rem;padding:10px 6px 10px 0;min-height:44px}
.back .icon{width:24px;height:24px}
.diya{display:inline-flex;align-items:center;gap:4px;padding:6px 10px 6px 8px;border-radius:999px;background:var(--surface);box-shadow:var(--lift);font-weight:700;font-size:.88rem;border:0;min-height:36px;color:var(--ink)}
.diya svg{width:20px;height:20px}
.diya.cold{color:var(--ink-2)}

.title-block{padding:2px 0 18px}
.large-title{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1.08;letter-spacing:-.02em}
.lede{color:var(--ink-2);font-size:.94rem;margin-top:6px;max-width:42ch}

/* ---------- powder fields ---------- */
.field{position:relative;border-radius:var(--r-field);overflow:hidden;isolation:isolate;color:var(--f-ink,#fff);background:var(--f-bg)}
.field::before{content:"";position:absolute;inset:-20%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(38% 42% at 12% 18%, color-mix(in srgb,var(--p1) 78%,transparent), transparent 70%),
   radial-gradient(44% 40% at 92% 12%, color-mix(in srgb,var(--p2) 70%,transparent), transparent 72%),
   radial-gradient(50% 46% at 85% 96%, color-mix(in srgb,var(--p3) 66%,transparent), transparent 72%),
   radial-gradient(36% 40% at 8% 92%, color-mix(in srgb,var(--p4) 60%,transparent), transparent 70%)}
.f-rani{--f-bg:#C90F6A;--p1:#FF5AA8;--p2:#FF8B1F;--p3:#7A1B9E;--p4:#FF3D7F;--f-ink:#FFFFFF;--f-ink-2:rgba(255,255,255,.86)}
.f-kesari{--f-bg:#F27A10;--p1:#FFC62E;--p2:#FF4F7B;--p3:#C84B00;--p4:#FFB061;--f-ink:#2A1300;--f-ink-2:rgba(42,19,0,.78)}
.f-mor{--f-bg:#08787B;--p1:#2ED3C9;--p2:#1F5FD6;--p3:#03595C;--p4:#5BE0A6;--f-ink:#FFFFFF;--f-ink-2:rgba(255,255,255,.86)}
.f-neel{--f-bg:#4334D1;--p1:#8E82FF;--p2:#E0157A;--p3:#241A8F;--p4:#3FA8FF;--f-ink:#FFFFFF;--f-ink-2:rgba(255,255,255,.86)}
.f-haldi{--f-bg:#FFBE1A;--p1:#FFE27A;--p2:#FF8B1F;--p3:#E89B00;--p4:#FFD35C;--f-ink:#2A1E00;--f-ink-2:rgba(42,30,0,.78)}
.f-jamuni{--f-bg:#7623C2;--p1:#C17BFF;--p2:#FF4FA0;--p3:#4A1488;--p4:#8E82FF;--f-ink:#FFFFFF;--f-ink-2:rgba(255,255,255,.86)}
.f-hara{--f-bg:#177A3E;--p1:#4FD483;--p2:#FFC62E;--p3:#0E6B33;--p4:#2ED3C9;--f-ink:#FFFFFF;--f-ink-2:rgba(255,255,255,.86)}
.f-today{--f-bg:color-mix(in srgb,var(--stage,var(--rani)) var(--today-tint),var(--today-base));--p1:color-mix(in srgb,var(--stage,var(--rani)) 74%,transparent);--p2:color-mix(in srgb,var(--kesari) 62%,transparent);--p3:color-mix(in srgb,var(--mor) 56%,transparent);--p4:color-mix(in srgb,var(--haldi) 68%,transparent);--f-ink:var(--today-ink);--f-ink-2:var(--today-ink-2);box-shadow:var(--lift)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .f-today{--p1:color-mix(in srgb,var(--stage,var(--rani)) 64%,transparent);--p2:color-mix(in srgb,var(--kesari) 50%,transparent);--p3:color-mix(in srgb,var(--mor) 54%,transparent);--p4:color-mix(in srgb,var(--neel) 60%,transparent)}}
:root[data-theme="dark"] .f-today{--p1:color-mix(in srgb,var(--stage,var(--rani)) 64%,transparent);--p2:color-mix(in srgb,var(--kesari) 50%,transparent);--p3:color-mix(in srgb,var(--mor) 54%,transparent);--p4:color-mix(in srgb,var(--neel) 60%,transparent)}
.field .f2{color:var(--f-ink-2)}

/* ---------- Today ---------- */
.greet{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0 16px}
.greet h1{font-family:var(--f-display);font-weight:700;font-size:2.35rem;line-height:1.05;letter-spacing:-.01em}
.greet p{color:var(--ink-2);font-size:.94rem;margin-top:6px;max-width:34ch}
.today-field{padding:18px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rg-wrap{position:relative;width:min(100%,330px);aspect-ratio:1;max-width:100%}
.rg-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.medal{position:absolute;left:34.5%;top:34.5%;width:31%;height:31%;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--surface);color:var(--ink);box-shadow:0 6px 18px -6px rgba(26,20,51,.35),0 0 0 6px color-mix(in srgb,var(--surface) 55%,transparent);padding:6px}
.medal .deva{font-size:clamp(1.05rem,5.4vw,1.45rem);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.medal small{font-size:.68rem;color:var(--ink-2);line-height:1.1;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-count{font-size:.94rem;text-align:center;color:var(--f-ink-2);text-wrap:balance;max-width:30ch}
.rg-count b{color:var(--f-ink);font-weight:700}
.today-field .btn{width:100%}

/* next lesson deck */
.sect{margin:30px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{font-size:1.25rem;font-weight:700;letter-spacing:-.015em}
.sect .link{font-size:.94rem}
.deck{position:relative;padding:0 0 14px}
.deck::before,.deck::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:40px;border-radius:var(--r-card);background:var(--d-bg2,var(--surface-2));z-index:0}
.deck::after{left:24px;right:24px;bottom:0;background:var(--d-bg3,var(--surface-2));opacity:.7}
.deck-card{position:relative;z-index:1;width:100%;border:0;text-align:left;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px;border-radius:var(--r-card);color:var(--f-ink);background:var(--f-bg);overflow:hidden;isolation:isolate}
.deck-card::before{content:"";position:absolute;inset:-30%;z-index:-1;background:radial-gradient(50% 60% at 100% 0%,color-mix(in srgb,var(--p1) 70%,transparent),transparent 70%),radial-gradient(40% 50% at 0% 100%,color-mix(in srgb,var(--p2) 55%,transparent),transparent 70%)}
.deck-card .dg{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1;min-width:58px;text-align:center}
.deck-card b{display:block;font-size:1.06rem}
.deck-card .dt-main{display:flex;flex-direction:column;min-width:0}
.deck-card .meta{font-size:.85rem;color:var(--f-ink-2)}
.deck-card .go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.f-kesari.deck-card .go,.f-haldi.deck-card .go{background:rgba(0,0,0,.10)}

/* dots meter (daily goal, unit lessons) */
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--dot-off)}
.dots i.on{background:var(--dc,var(--rani))}
.goalrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.goalrow b{font-size:.94rem}
.goalrow small{display:block;color:var(--ink-2);font-size:.8rem}

/* ---------- native lists ---------- */
.list{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--lift);overflow:hidden}
.list > * + *{border-top:.5px solid var(--hair)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .list{box-shadow:none}}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 14px 10px 16px;border:0;background:none;text-align:left;color:inherit}
.row:active{background:var(--sunk)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600;font-size:1rem;line-height:1.25}
.row-main span{font-size:.85rem;color:var(--ink-2);line-height:1.3}
.row-end{color:var(--ink-3);display:flex;align-items:center;gap:6px;font-size:.88rem}
.row-end .icon{width:18px;height:18px}
.tile-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--tci,#fff);background:var(--tc,var(--rani))}
.tile-ic .icon{width:20px;height:20px}
.tile-ic.deva{font-size:1rem;font-weight:700}
.row[disabled]{opacity:.5;cursor:default}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:52px;padding:0 22px;font-weight:600;font-size:1.03rem;background:var(--act);color:var(--on-act);transition:transform .14s var(--ease),filter .14s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn .icon{width:20px;height:20px}
.btn.light{background:#FFFFFF;color:#1A1433}
.btn.tonal{background:var(--act-soft);color:var(--rani-t)}
.btn.plain{background:none;color:var(--rani-t);padding:0 8px;min-height:44px}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:.94rem;border-radius:999px}
.btn[disabled]{background:var(--sunk);color:var(--ink-3);cursor:not-allowed;filter:none;transform:none}
.link{border:0;background:none;color:var(--rani-t);font-weight:600;padding:10px 0;min-height:44px}

/* segmented control (iOS) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:2px;gap:2px;margin:0 0 18px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:36px;font-weight:600;font-size:.88rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--surface-2)}}

/* ---------- Journey ---------- */
.stage{margin-bottom:30px}
.stage-field{padding:20px 20px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.stage-num{font-family:var(--f-display);font-weight:700;font-size:4.1rem;line-height:.9;grid-row:span 3}
.stage-field h2{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.1}
.stage-field p{font-size:.9rem;color:var(--f-ink-2);line-height:1.35}
.stage-field .dots{margin-top:8px}
.field .dots i{background:color-mix(in srgb,var(--f-ink) 28%,transparent)}
.field .dots i.on{background:var(--f-ink)}
.stage.locked .stage-field{filter:saturate(.35);opacity:.75}
.thread{position:relative;margin:6px 0 0;padding:4px 0 0}

<script>
"use strict";
/* ============================================================
   CURRICULUM
   Speaking track: practical, everyday Hindi aimed at talking with
   a partner and being polite with her family.
   Reading track: Devanagari, built up from vowels to real words.
   Gendered items: hi/rom = male speaker, hiF/romF = female speaker.
   ============================================================ */
const UNITS = [
 { id:"greet", track:"speak", glyph:"नमस्ते", title:"Hello & basics", blurb:"Namaste, yes, no, thank you, how are you",
   tip:`<p>Hindi has two everyday words for <b>you</b>. <span class="deva">आप</span> <i>aap</i> is respectful: use it with her parents, grandparents, aunties and uncles, and with strangers. <span class="deva">तुम</span> <i>tum</i> is warm and familiar: use it with her.</p>
   <p>Adjectives ending in <i>-aa</i> change with gender. The base form is <i>kaisa</i>. Use <span class="deva">कैसे</span> <i>kaise</i> for a man or a group, and <span class="deva">कैसी</span> <i>kaisi</i> for a woman. So you ask her father <i>aap kaise hain?</i> and her mother <i>aap kaisi hain?</i></p>
   <p>Adding <span class="deva">जी</span> <i>ji</i> after a word or name makes it polite: <i>haan ji</i> (yes, respectfully), <i>Uncle ji</i>, <i>Aunty ji</i>.</p>`,
   items:[
   {id:"g1",hi:"नमस्ते",rom:"namaste",en:"hello (respectful greeting)",note:"Said with palms pressed together. Works with everyone, any time of day."},
   {id:"g2",hi:"हाँ",rom:"haan",en:"yes",note:"The <b>ँ</b> mark makes the vowel nasal: let air through your nose."},
   {id:"g3",hi:"नहीं",rom:"nahin",en:"no / not",alt:["nahi","nai","nhi"]},
   {id:"g4",hi:"हाँ जी",rom:"haan ji",en:"yes (politely)",note:"Use this with her parents. A plain <i>haan</i> can sound abrupt to elders."},
   {id:"g5",hi:"शुक्रिया",rom:"shukriya",en:"thank you",note:"<i>Dhanyavaad</i> also means thank you and is more formal.",alt:["shukria","dhanyavaad","dhanyavad","dhanyawad"]},
   {id:"g6",hi:"ठीक है",rom:"theek hai",en:"okay / it's fine"},
   {id:"g7",hi:"अच्छा",rom:"achchha",en:"good / I see / okay",note:"One of the most used words in Hindi. Rising tone = 'Oh really?', falling tone = 'Okay, got it.'"},
   {id:"g8",hi:"तुम कैसी हो?",rom:"tum kaisi ho?",en:"how are you? (to her, informal)",love:true},
   {id:"g9",hi:"आप कैसे हैं?",rom:"aap kaise hain?",en:"how are you? (to a man, respectfully)",note:"Use this with her father or an uncle."},
   {id:"g10",hi:"आप कैसी हैं?",rom:"aap kaisi hain?",en:"how are you? (to a woman, respectfully)",note:"Use this with her mother or an aunty."},
   {id:"g11",hi:"मैं ठीक हूँ",rom:"main theek hoon",en:"I am fine"},
   {id:"g12",hi:"फिर मिलेंगे",rom:"phir milenge",en:"see you again"}
 ]},
 { id:"me", track:"speak", glyph:"मैं", title:"Me & you", blurb:"I, you, we, names, where you're from",
   tip:`<p>Hindi puts the verb <b>last</b>. "I fine am": <span class="deva">मैं ठीक हूँ</span> <i>main theek hoon</i>.</p>
   <p>The verb "to be" changes with the subject:</p>
   <div class="tablewrap"><table><tr><td class="deva">मैं हूँ</td><td>main hoon</td><td>I am</td></tr><tr><td class="deva">तुम हो</td><td>tum ho</td><td>you are (familiar)</td></tr><tr><td class="deva">आप हैं</td><td>aap hain</td><td>you are (respectful)</td></tr><tr><td class="deva">वह है</td><td>voh hai</td><td>he / she is</td></tr><tr><td class="deva">हम हैं</td><td>ham hain</td><td>we are</td></tr></table></div>
   <p>Notice that "he" and "she" are the same word, <i>voh</i>. Gender shows up in the verb and adjectives instead.</p>`,
   items:[
   {id:"m1",hi:"मैं",rom:"main",en:"I",alt:["mein","mai","me"]},
   {id:"m2",hi:"तुम",rom:"tum",en:"you (familiar, for her)",love:true},
   {id:"m3",hi:"आप",rom:"aap",en:"you (respectful, for elders)"},
   {id:"m4",hi:"वह",rom:"voh",en:"he / she / that",note:"Written <i>vah</i> but almost always said <i>voh</i>.",alt:["vo","wo","woh","vah","wah"]},
   {id:"m5",hi:"हम",rom:"ham",en:"we"},
   {id:"m6",hi:"मेरा नाम",rom:"mera naam",en:"my name",note:"<i>Mera naam Sam hai</i> = My name is Sam."},
   {id:"m7",hi:"आपका नाम क्या है?",rom:"aapka naam kya hai?",en:"what is your name? (respectful)"},
   {id:"m8",hi:"आप कहाँ से हैं?",rom:"aap kahaan se hain?",en:"where are you from? (respectful)"},
   {id:"m9",hi:"मैं हिंदी सीख रहा हूँ",rom:"main hindi seekh raha hoon",hiF:"मैं हिंदी सीख रही हूँ",romF:"main hindi seekh rahi hoon",en:"I am learning Hindi",note:"A man says <i>raha</i>, a woman says <i>rahi</i>. Her family will love hearing this."},
   {id:"m10",hi:"मुझे थोड़ी-थोड़ी हिंदी आती है",rom:"mujhe thodi-thodi hindi aati hai",en:"I know a little Hindi"}
 ]},
 { id:"num", track:"speak", glyph:"१२३", title:"Numbers 1–10", blurb:"Count, tell prices, set times",
   tip:`<p>Hindi has its own digits too: १ २ ३ ४ ५ ६ ७ ८ ९ १०. You'll mostly see the ordinary 1, 2, 3 in daily life, but the words are what matter.</p><p><b>Tip:</b> <i>do</i> (2) has a long <i>o</i>, as in 'go'. <i>Das</i> (10) is short and crisp. <i>Chaar</i> (4) has a long <i>aa</i>.</p>`,
   items:[
   {id:"n1",hi:"एक",rom:"ek",en:"one (1)"},
   {id:"n2",hi:"दो",rom:"do",en:"two (2)"},
   {id:"n3",hi:"तीन",rom:"teen",en:"three (3)"},
   {id:"n4",hi:"चार",rom:"chaar",en:"four (4)"},
   {id:"n5",hi:"पाँच",rom:"paanch",en:"five (5)"},
   {id:"n6",hi:"छह",rom:"chhah",en:"six (6)",note:"Usually pronounced <i>chhe</i>.",alt:["chhe","che","chah","cheh"]},
   {id:"n7",hi:"सात",rom:"saat",en:"seven (7)"},
   {id:"n8",hi:"आठ",rom:"aath",en:"eight (8)"},
   {id:"n9",hi:"नौ",rom:"nau",en:"nine (9)"},
   {id:"n10",hi:"दस",rom:"das",en:"ten (10)",alt:["dus"]}
 ]},
 { id:"family", track:"speak", glyph:"परिवार", title:"Meeting her family", blurb:"Mom, dad, siblings, and how to be respectful",
   tip:`<p>Family is central, and respect is shown through language. With elders always use <b>aap</b> and add <b>ji</b>.</p>
   <p><b>What to call her parents:</b> as her partner, you'd usually say <span class="deva">अंकल जी</span> <i>Uncle ji</i> and <span class="deva">आंटी जी</span> <i>Aunty ji</i>, not Papa and Mummy. Those are for their own children (or after marriage, if they invite it).</p>
   <p>Grandparents have different names depending on the side of the family: <i>dadi / dada</i> are dad's parents, <i>nani / nana</i> are mom's parents.</p>
   <p>In many families younger people touch elders' feet as a greeting. The elder blesses you in return. If you do this, a quiet <i>namaste</i> or <i>pranaam</i> goes with it.</p>
   <p>Possessives agree with the <b>person owned</b>, not the owner: <span class="deva">मेरी माँ</span> <i>meri maa</i> (my mom), <span class="deva">मेरा भाई</span> <i>mera bhai</i> (my brother), <span class="deva">मेरे पापा</span> <i>mere papa</i> (my dad; <i>mere</i> is used for respect).</p>`,
   items:[
   {id:"f1",hi:"परिवार",rom:"parivaar",en:"family"},
   {id:"f2",hi:"माँ",rom:"maa",en:"mother / mom"},
   {id:"f3",hi:"पापा",rom:"papa",en:"dad"},
   {id:"f4",hi:"भाई",rom:"bhai",en:"brother"},
   {id:"f5",hi:"बहन",rom:"behen",en:"sister",alt:["bahan","behan","bahen"]},
   {id:"f6",hi:"दादी",rom:"daadi",en:"grandmother (dad's mother)"},
   {id:"f7",hi:"नानी",rom:"naani",en:"grandmother (mom's mother)"},
   {id:"f8",hi:"आपसे मिलकर बहुत ख़ुशी हुई",rom:"aapse milkar bahut khushi hui",en:"I'm very happy to meet you",note:"Perfect for first meeting her parents. Smile, say it slowly."},
   {id:"f9",hi:"मेरी माँ",rom:"meri maa",en:"my mother"},
   {id:"f10",hi:"मेरे पापा",rom:"mere papa",en:"my dad",note:"<i>Mere</i> (not <i>mera</i>) because elders are referred to respectfully, as if plural."},
   {id:"f11",hi:"आशीर्वाद दीजिए",rom:"aashirvaad deejiye",en:"please give me your blessings",note:"A warm thing to say to elders, especially at festivals or before something important."},
   {id:"f12",hi:"अंकल जी",rom:"uncle ji",en:"Uncle ji (how you address her father)",alt:["ankal ji"]},
   {id:"f13",hi:"आंटी जी",rom:"aunty ji",en:"Aunty ji (how you address her mother)",alt:["aunti ji","anti ji","auntie ji"]},
   {id:"f14",hi:"नमस्ते आंटी जी",rom:"namaste aunty ji",en:"hello, Aunty ji",alt:["namaste aunti ji","namaste auntie ji"]},
   {id:"f15",hi:"मम्मी",rom:"mummy",en:"mom (everyday word)",note:"In speech, <i>mummy</i> is more common than <i>maa</i>. <i>Tumhari mummy</i> = your mom (talking to her).",alt:["mumi","mammi","mummi"]}
 ]},
 { id:"food", track:"speak", glyph:"चाय", title:"Food & chai", blurb:"Eat, drink, compliment the cook, say 'enough!'",
   tip:`<p>At a family meal you will be offered more food. Then more. Learn <span class="deva">बस, और नहीं</span> <i>bas, aur nahin</i> early, and say it with a smile and a hand over your plate.</p>
   <p>Complimenting the food is one of the fastest ways into anyone's heart: <i>bahut swaadisht hai!</i></p>
   <p><span class="deva">मुझे</span> <i>mujhe</i> means "to me". Many feelings in Hindi are said as things that happen <i>to</i> you: <i>mujhe bhookh lagi hai</i> is literally "hunger has struck me".</p>`,

   tip:`<p>With her you'll use <b>tum</b>. Verbs about yourself change with <b>your</b> gender: a man says <i>karta hoon</i>, a woman says <i>karti hoon</i>. You can set your gender in Profile and the app will teach you the right form.</p>
   <p><span class="deva">जान</span> <i>jaan</i> literally means "life". Calling someone <i>meri jaan</i> is like saying "my love" or "my darling".</p>

 { id:"verbs", track:"speak", glyph:"बोलो", title:"Verbs & understanding", blurb:"Eat, drink, go, speak — and 'please slow down'",
   tip:`<p>Every Hindi verb's dictionary form ends in <b>-na</b>: <i>khaana</i> (to eat), <i>peena</i> (to drink), <i>bolna</i> (to speak).</p>
   <p>For things you do regularly: drop <i>-na</i>, add <i>-ta</i> (man) or <i>-ti</i> (woman), then <i>hoon</i>:</p>
   <div class="tablewrap"><table><tr><td class="deva">पीना</td><td>peena</td><td>to drink</td></tr><tr><td class="deva">मैं पीता हूँ</td><td>main peeta hoon</td><td>I drink (man)</td></tr><tr><td class="deva">मैं पीती हूँ</td><td>main peeti hoon</td><td>I drink (woman)</td></tr></table></div>
   <p>Polite requests end in <b>-iye</b>: <i>boliye</i> (please speak), <i>baithiye</i> (please sit). These are lifesavers when her family speaks fast.</p>
   <p>With her (<i>tum</i>), requests end in <b>-o</b>: <i>bolo</i>, <i>baitho</i>, <i>aao</i>.</p>`,

 { id:"post", track:"speak", glyph:"का की के", title:"Of, in, on, to", blurb:"Little words that hold sentences together",
   tip:`<p>Hindi uses <b>postpositions</b>: small words that come <i>after</i> the noun. "home in" = <i>ghar mein</i> (in the home).</p>
   <p><span class="deva">का / की / के</span> mean "of" or "'s" and agree with the thing owned: <i>Priya ka ghar</i> (Priya's house, masculine), <i>Priya ki chaai</i> (Priya's tea, feminine), <i>Priya ke papa</i> (Priya's dad, respectful).</p>
   <p>Pronouns merge with them: <i>mera</i> (my), <i>tumhara</i> (your), <i>uska</i> (his/her).</p>`,

 { id:"likes", track:"speak", glyph:"पसंद", title:"Likes, wants & knowing", blurb:"I like, I need, I know, I don't know",
   tip:`<p>Hindi says "to me, X is liked": <span class="deva">मुझे चाय पसंद है</span> <i>mujhe chai pasand hai</i>. The person goes in the "to me / to you" form:</p>

 { id:"past", track:"speak", glyph:"था", title:"Past tense", blurb:"I went, I ate, did you get home?",
   tip:`<p>Simple past for "going" verbs: <i>main gaya</i> (man) / <i>main gayi</i> (woman), <i>main so gaya / gayi</i> (I fell asleep).</p>
   <p>With verbs that take an object (eat, drink, see, do), the subject takes <b>ne</b>: <i>maine</i> (I), <i>tumne</i> (you). Then the verb agrees with the <b>object</b>, not with you: <i>maine khaana khaaya</i> (khaana is masculine), <i>maine chai pee</i> (chai is feminine). This trips everyone up; the drills help.</p>
   <p><b>tha / thi</b> = was: <i>main ghar par tha / thi</i> (I was at home).</p>`,

 { id:"perfect", track:"speak", glyph:"चुका", title:"Have done, had done", blurb:"Experiences, news, 'already'",
   tip:`<p>Add <i>hai</i> to the past for "have done": <i>maine yeh film dekhi hai</i> (I've seen this film). Add <i>tha</i> for "had done": <i>usne mujhe bataaya tha</i> (she had told me).</p>
   <p>Remember <b>ne</b>: with object-taking verbs, the verb agrees with the object. <i>Film</i> is feminine, so <i>dekhi</i>. <i>Baatein</i> (talks) is feminine plural, so <i>keen</i>.</p>
   <p><i>chuka</i> = already: <i>main kha chuka hoon</i> (I've already eaten).</p>`,

 { id:"ifthen", track:"speak", glyph:"अगर", title:"If, hope, I think", blurb:"Conditions, wishes, reported speech",
   tip:`<p><i>agar ... to ...</i> = if ... then: <i>agar tum chaaho, to ham chal sakte hain</i>.</p>
   <p><i>ki</i> (that) introduces what you think or say: <i>mujhe lagta hai ki voh sahi hai</i> (I think that she's right). It's written <span class="deva">कि</span>, with a short i, unlike <span class="deva">की</span> (of).</p>
   <p>The <b>subjunctive</b> (-oon, -e, -ein) is for wishes, suggestions and "should I?": <i>main kya karoon?</i> (what should I do?).</p>`,

 { id:"compound", track:"speak", glyph:"कर", title:"Sounding natural", blurb:"Compound verbs and 'having done'",
   tip:`<p>Native speakers add a second verb for nuance: <i>kha lo</i> (go ahead, eat), <i>bata do</i> (tell me), <i>so jao</i> (go to sleep). Roughly: <b>lena</b> = for yourself, <b>dena</b> = for someone else, <b>jaana</b> = completion or change.</p>
   <p><b>-kar</b> means "having done": <i>khaana khaakar chalenge</i> (we'll go after eating), <i>nahaakar aata hoon</i> (I'll shower and come).</p>`,

 { id:"relatives", track:"speak", glyph:"रिश्ते", title:"The whole family", blurb:"Aunts, uncles, in-laws, siblings' spouses",
   tip:`<p>Hindi has a precise word for every relative, depending on which side they're on. Dad's side: <i>chacha</i> (dad's younger brother), <i>taau ji</i> (dad's elder brother), <i>bua</i> (dad's sister). Mom's side: <i>mama</i> (mom's brother), <i>mausi</i> (mom's sister).</p>
   <p>Elder siblings get a title: <i>didi</i>, <i>bhaiya</i>. Their spouses: <i>jija ji</i> (sister's husband), <i>bhabhi</i> (brother's wife).</p>
   <p>If you marry into the family: <i>saas</i> (mother-in-law), <i>sasur</i> (father-in-law), <i>sasuraal</i> (your in-laws' home).</p>`,

 { id:"compare", track:"speak", glyph:"से", title:"Comparing & 'the one who'", blurb:"More than, the most, who, when, where",
   tip:`<p>Compare with <i>se</i> (than) plus <i>zyaada</i> (more) or <i>kam</i> (less): <i>mera bhai mujhse bada hai</i> (my brother is older than me). The superlative is <i>sabse</i> ("than all"): <i>sabse achchha</i> (the best).</p>
   <p>Relative sentences come in pairs: <i>jo ... voh</i> (who ... that one), <i>jab ... tab</i> (when ... then), <i>jahaan ... vahaan</i> (where ... there): <i>jo ladki vahaan hai, voh meri dost hai</i>.</p>`,

   tip:`<p>Formal (<i>shuddh</i>) Hindi uses Sanskrit-origin words where everyday speech uses Urdu or English ones: <i>dhanyavaad</i> vs <i>shukriya</i>, <i>kshama</i> vs <i>maafi</i>, <i>kripaya</i> vs "please". You'll see it on signs, in the news and on forms.</p>

 { id:"getdone", track:"speak", glyph:"करवाना", title:"Getting things done", blurb:"Causatives and the passive",
   tip:`<p><b>Causatives</b> change who does the action. <i>banaana</i> = to make; <i>banvaana</i> = to have something made. <i>dekhna</i> = to see; <i>dikhaana</i> = to show. <i>seekhna</i> = to learn; <i>sikhaana</i> = to teach.</p>
   <p><b>Passive:</b> past form + <i>jaana</i>: <i>yahaan hindi boli jaati hai</i> (Hindi is spoken here), <i>mujhe bataaya gaya</i> (I was told).</p>`,

 { id:"deep", track:"speak", glyph:"दिल", title:"Deeper feelings", blurb:"Hurt, sorry, care, making up", love:true,
   tip:`<p>Feelings often happen <i>to</i> you in Hindi: <i>mujhe bura laga</i> (it felt bad to me, I was hurt), <i>mujhe sharm aa rahi hai</i> (shyness is coming to me).</p>
   <p>After a fight, three phrases do most of the work: <i>mera matlab voh nahin tha</i> (I didn't mean that), <i>main galat tha / thi</i> (I was wrong), and <i>mujhse baat karo</i> (talk to me).</p>`,

 { id:"media", track:"speak", glyph:"गाना", title:"Films, songs & poetry", blurb:"Talk about Bollywood, music and shayari",

 { id:"time2", track:"speak", glyph:"घड़ी", title:"Telling time & dates", blurb:"Quarter past, half past, what's the date",
   tip:`<p>Hindi tells time with fractions. <b>sava</b> = quarter past (<i>sava teen</i>, 3:15), <b>saadhe</b> = half past (<i>saadhe teen</i>, 3:30), <b>paune</b> = a quarter <i>to</i> the next hour (<i>paune chaar</i>, 3:45).</p>
   <p>Two half-hours have their own words: <b>dedh</b> (1:30) and <b>dhaai</b> (2:30). <i>Saadhe ek</i> and <i>saadhe do</i> sound wrong to native ears.</p>
   <p>Add the time of day in front: <i>subah ke aath baje</i> (8 a.m.), <i>raat ke das baje</i> (10 p.m.). Try the Time gym in Practice.</p>`,

 { id:"r_vow", track:"read", glyph:"अ", title:"Vowels", blurb:"The 10 main vowel letters",
   tip:`<p>Devanagari is read left to right. Most letters hang from a line on top called the <b>shirorekha</b>, which joins letters into words.</p>
   <p>Vowels come in short/long pairs: <span class="deva">इ</span> <i>i</i> (as in "bit") vs <span class="deva">ई</span> <i>ee</i> (as in "beet"). Long vowels are held about twice as long.</p>
   <p>These full vowel letters are used at the start of words. After a consonant, a vowel becomes a small mark instead (you'll learn those in "Vowel marks").</p>`,

 { id:"r_k", track:"read", glyph:"क", title:"Consonants: k, ch", blurb:"क ख ग घ  च छ ज झ",
   tip:`<p>Every consonant carries a built-in short <i>a</i>: <span class="deva">क</span> is <i>ka</i>, not just <i>k</i>.</p>
   <p>Hindi distinguishes <b>aspirated</b> sounds (with a puff of air) from plain ones. Hold your hand in front of your mouth: <i>ka</i> has almost no puff, <i>kha</i> has a strong one. Aspirated sounds are written with an <i>h</i> in romanization.</p>`,

 { id:"r_t", track:"read", glyph:"त", title:"Consonants: t, d, n", blurb:"ट ठ ड ढ  त थ द ध न",
   tip:`<p>Hindi has <b>two</b> kinds of t and d. This is the trickiest part of pronunciation, and native speakers hear the difference clearly.</p>
   <p><b>Hard (retroflex)</b> <span class="deva">ट ठ ड ढ</span>: curl your tongue tip back and tap the roof of your mouth. Sounds close to English t/d.</p>
   <p><b>Soft (dental)</b> <span class="deva">त थ द ध</span>: press your tongue tip against the back of your top teeth. Softer than English.</p>
   <p>Everyday romanization doesn't mark the difference: <i>theek</i> is ठीक (hard), <i>tum</i> is तुम (soft). In this track, capitals mark the hard ones: <i>Ta</i> vs <i>ta</i>.</p>`,

   {id:"rt1",hi:"ट",rom:"Ta",en:"Ta (hard)",hint:"tongue curled back, like English 't'"},

   {id:"rt3",hi:"ड",rom:"Da",en:"Da (hard)",hint:"tongue curled back, like English 'd'"},
   {id:"rt4",hi:"ढ",rom:"Dha",en:"Dha (hard)",hint:"hard d with breath"},

  ["अमन को सब कुछ नया लगा, लेकिन उसे बहुत अच्छा लगा।","aman ko sab kuchh naya laga, lekin use bahut achchha laga.","Everything felt new to Aman, but he loved it."]],
  qs:[["Where does the family gather?",["At Grandma's house","At Priya's house","At a restaurant"]],["What did Aman bring?",["A box of sweets","Flowers","Lamps"]],["What did Grandma say to him?",["Live long, child","Go home, child","Sit down, child"]]]},
 {id:"st7", after:"contin", level:"B1", title:"Grandma's story", titleHi:"दादी की कहानी", blurb:"How life used to be in the village.", lines:[
  ["जब दादी छोटी थीं, वे एक छोटे-से गाँव में रहती थीं।","jab daadi chhoti theen, ve ek chhote-se gaanv mein rehti theen.","When Grandma was little, she lived in a small village."],
  ["वहाँ बिजली नहीं थी, इसलिए सब लोग जल्दी सो जाते थे।","vahaan bijli nahin thi, isliye sab log jaldi so jaate the.","There was no electricity there, so everyone went to sleep early."],
  ["दादी रोज़ सुबह कुएँ से पानी लाती थीं।","daadi roz subah kuen se paani laati theen.","Every morning Grandma fetched water from the well."],
  ["जिनसे उनकी शादी हुई, वे पास के गाँव के थे।","jinse unki shaadi hui, ve paas ke gaanv ke the.","The man she married was from a nearby village."],
  ["शादी से पहले दादी ने उन्हें सिर्फ़ एक बार देखा था।","shaadi se pehle daadi ne unhein sirf ek baar dekha tha.","Before the wedding Grandma had seen him only once."],
  ["दादी हँसकर कहती हैं, \"तुम लोगों के पास तो फ़ोन है!\"","daadi hanskar kehti hain, \"tum logon ke paas to phone hai!\"","Grandma laughs and says, \"You people have phones!\""]],
  qs:[["Where did Grandma live as a child?",["In a small village","In a big city","Abroad"]],["Why did everyone sleep early?",["There was no electricity","They worked a lot","It was cold"]],["How many times had she seen her husband before the wedding?",["Once","Never","Many times"]]]},
 {id:"st6", after:"can", level:"B1", title:"A letter to Priya", titleHi:"प्रिया के नाम एक ख़त", blurb:"Aman writes about learning Hindi.", lines:[
  ["प्रिया, एक साल पहले मुझे हिंदी का एक शब्द भी नहीं आता था।","priya, ek saal pehle mujhe hindi ka ek shabd bhi nahin aata tha.","Priya, a year ago I didn't know a single word of Hindi."],
  ["मैंने तुम्हारे लिए सीखना शुरू किया।","maine tumhare liye seekhna shuru kiya.","I started learning for you."],
  ["शुरू में यह बहुत मुश्किल था।","shuru mein yeh bahut mushkil tha.","At first it was very hard."],
  ["लेकिन अब मैं तुम्हारे परिवार से बात कर सकता हूँ।","lekin ab main tumhare parivaar se baat kar sakta hoon.","But now I can talk with your family."],
  ["अगर मैं कोई ग़लती करूँ, तो हँसना मत।","agar main koi galti karoon, to hansna mat.","If I make a mistake, don't laugh."],
  ["बस मेरी ग़लती सुधार देना।","bas meri galti sudhaar dena.","Just correct my mistake."],
  ["तुम्हारा, अमन","tumhara, aman","Yours, Aman"]],
  qs:[["When did Aman start learning?",["A year ago","A month ago","Ten years ago"]],["Why did he start?",["For Priya","For work","For travel"]],["What does he ask her to do?",["Correct his mistakes","Call him every day","Teach her family English"]]]},
 {id:"st8", after:"perfect", level:"B1", title:"A small fight", titleHi:"छोटा-सा झगड़ा", blurb:"Late, no call, and making up.", lines:[
  ["आज प्रिया और अमन के बीच छोटा-सा झगड़ा हुआ।","aaj priya aur aman ke beech chhota-sa jhagda hua.","Today Priya and Aman had a small fight."],
  ["अमन देर से आया था और उसने फ़ोन भी नहीं किया था।","aman der se aaya tha aur usne phone bhi nahin kiya tha.","Aman had come late, and he hadn't even called."],
  ["प्रिया ने कहा, \"मुझे तुम्हारी चिंता हो रही थी!\"","priya ne kaha, \"mujhe tumhari chinta ho rahi thi!\"","Priya said, \"I was worried about you!\""],
  ["अमन ने कहा, \"तुम सही हो। मुझे माफ़ कर दो।\"","aman ne kaha, \"tum sahi ho. mujhe maaf kar do.\"","Aman said, \"You're right. Forgive me.\""],
  ["\"अगली बार फ़ोन ज़रूर करूँगा।\"","\"agli baar phone zaroor karoonga.\"","\"Next time I'll definitely call.\""],
  ["प्रिया थोड़ी देर चुप रही, फिर मुस्कुरा दी।","priya thodi der chup rahi, phir muskura di.","Priya was quiet for a while, then smiled."],
  ["\"ठीक है, लेकिन आज का डिनर तुम्हारी तरफ़ से!\"","\"theek hai, lekin aaj ka dinner tumhari taraf se!\"","\"Okay, but tonight's dinner is on you!\""]],
  qs:[["Why did they fight?",["Aman came late and didn't call","He forgot her birthday","He ate her food"]],["How had Priya been feeling?",["Worried","Happy","Sleepy"]],["How does it end?",["Dinner is on Aman","They go home separately","Aman cries"]]]},
 {id:"st9", after:"body", level:"A2", title:"Aman gets sick", titleHi:"बीमार अमन", blurb:"A fever, some soup, and a bossy Priya.", lines:[
  ["आज अमन की तबीयत ठीक नहीं है।","aaj aman ki tabiyat theek nahin hai.","Aman isn't feeling well today."],
  ["उसे बुखार है और सिर में भी दर्द है।","use bukhaar hai aur sir mein bhi dard hai.","He has a fever, and a headache too."],
  ["प्रिया सूप लेकर उसके घर आती है।","priya soop lekar uske ghar aati hai.","Priya comes to his place with soup."],
  ["\"तुमने दवाई ली?\"","\"tumne davaai lee?\"","\"Did you take your medicine?\""],
  ["\"अभी नहीं।\"","\"abhi nahin.\"","\"Not yet.\""],
  ["\"पहले दवाई लो, फिर सूप पियो, और फिर आराम करो!\"","\"pehle davaai lo, phir soop piyo, aur phir aaraam karo!\"","\"First take the medicine, then drink the soup, and then rest!\""],
  ["अमन मुस्कुराता है। \"तुम बिल्कुल अपनी मम्मी जैसी हो।\"","aman muskuraata hai. \"tum bilkul apni mummy jaisi ho.\"","Aman smiles. \"You're just like your mom.\""],
  ["प्रिया हँसकर कहती है, \"अब चुप, और सो जाओ।\"","priya hanskar kehti hai, \"ab chup, aur so jao.\"","Priya laughs and says, \"Now hush, and go to sleep.\""]],
  qs:[["What's wrong with Aman?",["A fever and a headache","A stomach ache","A broken leg"]],["What does Priya bring?",["Soup","Sweets","Flowers"]],["Who does Aman say she's like?",["Her mom","Her grandma","His mom"]]]},
 {id:"st10", after:"shop", level:"A2", title:"At the market", titleHi:"बाज़ार में", blurb:"Aman tries bargaining in Delhi.", lines:[
  ["शनिवार को प्रिया और अमन सरोजिनी नगर बाज़ार गए।","shanivaar ko priya aur aman sarojini nagar baazaar gaye.","On Saturday Priya and Aman went to Sarojini Nagar market."],
  ["वहाँ बहुत भीड़ थी।","vahaan bahut bheed thi.","It was very crowded."],
  ["अमन को एक नीली शर्ट पसंद आई।","aman ko ek neeli shirt pasand aayi.","Aman liked a blue shirt."],
  ["\"भैया, यह कितने की है?\"","\"bhaiya, yeh kitne ki hai?\"","\"Brother, how much is this?\""],
  ["\"पाँच सौ रुपये।\"","\"paanch sau rupaye.\"","\"Five hundred rupees.\""],
  ["\"बहुत महँगी है! तीन सौ में दीजिए।\"","\"bahut mahangi hai! teen sau mein deejiye.\"","\"That's too expensive! Give it to me for three hundred.\""],
  ["\"चलिए, चार सौ।\"","\"chaliye, chaar sau.\"","\"Alright, four hundred.\""],
  ["\"ठीक है, यह लीजिए।\"","\"theek hai, yeh leejiye.\"","\"Okay, here you go.\""],
  ["प्रिया ने धीरे से कहा, \"वाह, तुम तो पक्के दिल्ली वाले बन गए!\"","priya ne dheere se kaha, \"vaah, tum to pakke dilli vaale ban gaye!\"","Priya said quietly, \"Wow, you've become a real Delhiite!\""]],
  qs:[["What did Aman like?",["A blue shirt","A red sari","A pair of shoes"]],["What was the first price?",["500 rupees","300 rupees","400 rupees"]],["What did he pay in the end?",["400 rupees","300 rupees","500 rupees"]]]},
 {id:"st11", after:"ifthen", level:"B1", title:"Dreams on the rooftop", titleHi:"छत पर सपने", blurb:"Where would they live one day?", lines:[
  ["रात को छत पर बैठकर प्रिया और अमन बातें कर रहे थे।","raat ko chhat par baithkar priya aur aman baatein kar rahe the.","At night, sitting on the roof, Priya and Aman were talking."],
  ["\"अगर हम कभी भारत में रहें, तो तुम कहाँ रहना चाहोगे?\"","\"agar ham kabhi bhaarat mein rahein, to tum kahaan rehna chaahoge?\"","\"If we ever live in India, where would you want to live?\""],
  ["अमन ने सोचा। \"शायद पहाड़ों में, जहाँ शांति हो।\"","aman ne socha. \"shaayad pahaadon mein, jahaan shaanti ho.\"","Aman thought. \"Maybe in the mountains, where it's peaceful.\""],
  ["\"और मैं? मुझे तो शहर पसंद है!\"","\"aur main? mujhe to shehar pasand hai!\"","\"And me? I like the city!\""],
  ["\"तो गर्मियों में पहाड़, और सर्दियों में शहर?\"","\"to garmiyon mein pahaad, aur sardiyon mein shehar?\"","\"So the mountains in summer, and the city in winter?\""],
  ["प्रिया हँसी। \"मुझे लगता है कि हम ठीक रहेंगे।\"","priya hansi. \"mujhe lagta hai ki ham theek rahenge.\"","Priya laughed. \"I think we'll be fine.\""]],
  qs:[["Where were they sitting?",["On the roof","In a car","In a café"]],["Where would Aman like to live?",["In the mountains","In a big city","By the sea"]],["What's their compromise?",["Mountains in summer, city in winter","The city all year round","They'll live apart"]]]},
 {id:"st12", after:"relatives", level:"B1", title:"The wedding", titleHi:"शादी में", blurb:"A hundred relatives and a dhol.", lines:[
  ["प्रिया की कज़िन की शादी थी, और पूरा परिवार इकट्ठा हुआ था।","priya ki cousin ki shaadi thi, aur poora parivaar ikattha hua tha.","It was Priya's cousin's wedding, and the whole family had gathered."],
  ["अमन को सबसे मिलवाया गया: चाचा, मामा, बुआ, मौसी...","aman ko sabse milvaaya gaya: chaacha, maama, bua, mausi...","Aman was introduced to everyone: uncles and aunts from every side..."],
  ["इतने सारे रिश्ते याद रखना आसान नहीं था।","itne saare rishte yaad rakhna aasaan nahin tha.","Remembering so many relationships wasn't easy."],
  ["मौसी जी ने पूछा, \"बेटा, तुम्हें नाचना आता है?\"","mausi ji ne poochha, \"beta, tumhein naachna aata hai?\"","Mausi ji asked, \"Dear, do you know how to dance?\""],
  ["\"थोड़ा-थोड़ा,\" अमन ने कहा।","\"thoda-thoda,\" aman ne kaha.","\"A little,\" Aman said."],
  ["फिर ढोल बजा, और सब उसे खींचकर डांस फ़्लोर पर ले गए।","phir dhol baja, aur sab use kheenchkar dance floor par le gaye.","Then the dhol started, and everyone dragged him onto the dance floor."],
  ["उस रात अमन इतना नाचा कि अगले दिन उसके पैर दर्द कर रहे थे।","us raat aman itna naacha ki agle din uske pair dard kar rahe the.","That night Aman danced so much that his feet hurt the next day."]],
  qs:[["Whose wedding was it?",["Priya's cousin's","Priya's brother's","Aman's friend's"]],["What wasn't easy for Aman?",["Remembering all the relatives","Eating the food","Finding the venue"]],["What happened the next day?",["His feet hurt","He slept all day","He left early"]]]},
 {id:"st13", after:"compare", level:"B2", title:"Two cities", titleHi:"दो शहर", blurb:"Aman compares his town with Delhi.", lines:[
  ["अमन का शहर छोटा और शांत है, जबकि दिल्ली बड़ी और भीड़-भाड़ वाली है।","aman ka shehar chhota aur shaant hai, jabki dilli badi aur bheed-bhaad vaali hai.","Aman's town is small and quiet, whereas Delhi is big and crowded."],
  ["दिल्ली में खाना ज़्यादा तीखा होता है, लेकिन कहीं ज़्यादा स्वादिष्ट भी।","dilli mein khaana zyaada teekha hota hai, lekin kaheen zyaada swaadisht bhi.","In Delhi the food is spicier, but far tastier too."],
  ["अमन के शहर में लोग जल्दी सोते हैं; दिल्ली में तो रात को भी सड़कें जागती रहती हैं।","aman ke shehar mein log jaldi sote hain; dilli mein to raat ko bhi sadkein jaagti rehti hain.","In Aman's town people sleep early; in Delhi the streets stay awake even at night."],
  ["जो चीज़ दोनों शहरों में एक जैसी है, वह है परिवार की अहमियत।","jo cheez donon shehron mein ek jaisi hai, voh hai parivaar ki ahmiyat.","The one thing that's the same in both cities is how much family matters."],
  ["अमन कहता है, \"मेरे लिए सबसे अच्छा शहर वही है, जहाँ तुम हो।\"","aman kehta hai, \"mere liye sabse achchha shehar vahi hai, jahaan tum ho.\"","Aman says, \"For me, the best city is the one where you are.\""]],
  qs:[["How is Delhi described?",["Big and crowded","Small and quiet","Cold and empty"]],["What is the same in both cities?",["How much family matters","The food","The weather"]],["Which city is best for Aman?",["Wherever Priya is","Delhi","His own town"]]]},
 {id:"st14", after:"big", level:"B2", title:"The question", titleHi:"वह सवाल", blurb:"Aman asks Priya's parents for their blessing.", lines:[
  ["अमन ने महीनों तक इस दिन की तैयारी की थी।","aman ne maheenon tak is din ki taiyaari ki thi.","Aman had prepared for this day for months."],
  ["वह अंकल जी और आंटी जी के सामने बैठा था, और उसके हाथ काँप रहे थे।","voh uncle ji aur aunty ji ke saamne baitha tha, aur uske haath kaanp rahe the.","He was sitting in front of Uncle ji and Aunty ji, and his hands were shaking."],
  ["\"अंकल जी, आंटी जी, मैं आपसे कुछ कहना चाहता हूँ।\"","\"uncle ji, aunty ji, main aapse kuchh kehna chahta hoon.\"","\"Uncle ji, Aunty ji, there's something I'd like to tell you.\""],
  ["\"मैं प्रिया से बहुत प्यार करता हूँ, और मैं उससे शादी करना चाहता हूँ।\"","\"main priya se bahut pyaar karta hoon, aur main usse shaadi karna chahta hoon.\"","\"I love Priya very much, and I want to marry her.\""],
  ["\"मैं वादा करता हूँ कि मैं उसे हमेशा ख़ुश रखूँगा।\"","\"main vaada karta hoon ki main use hamesha khush rakhoonga.\"","\"I promise that I'll always keep her happy.\""],
  ["\"मुझे आपका आशीर्वाद चाहिए।\"","\"mujhe aapka aashirvaad chahiye.\"","\"I'd like your blessing.\""],
  ["कमरे में कुछ पल के लिए ख़ामोशी छा गई।","kamre mein kuchh pal ke liye khaamoshi chha gayi.","For a few moments the room fell silent."],
  ["फिर अंकल जी मुस्कुराए। \"बेटा, तुमने यह सब हिंदी में कहा। हमारा जवाब हाँ है।\"","phir uncle ji muskuraaye. \"beta, tumne yeh sab hindi mein kaha. hamaara javaab haan hai.\"","Then Uncle ji smiled. \"Son, you said all of this in Hindi. Our answer is yes.\""]],
  qs:[["Who is Aman talking to?",["Priya's parents","Priya","His friends"]],["How was Aman feeling?",["Nervous: his hands were shaking","Bored","Angry"]],["What did Uncle ji say?",["Yes","No","Wait a year"]]]},
 {id:"st15", after:"cook", level:"A2", title:"Parathas with Mummy", titleHi:"रसोई में", blurb:"A cooking lesson, and onion tears.", lines:[
  ["रविवार को प्रिया की मम्मी ने अमन को रसोई में बुलाया।","ravivaar ko priya ki mummy ne aman ko rasoi mein bulaaya.","On Sunday, Priya's mother called Aman into the kitchen."],
  ["\"आज मैं तुम्हें आलू के पराठे बनाना सिखाऊँगी।\"","\"aaj main tumhein aaloo ke paraathe banaana sikhaaoongi.\"","\"Today I'll teach you how to make aloo parathas.\""],
  ["अमन ने आलू उबाले और प्याज़ काटा।","aman ne aaloo ubaale aur pyaaz kaata.","Aman boiled the potatoes and chopped the onion."],
  ["प्याज़ काटते-काटते उसकी आँखों में आँसू आ गए।","pyaaz kaatte-kaatte uski aankhon mein aansoo aa gaye.","While he was chopping the onion, tears came to his eyes."],
  ["मम्मी हँसीं, \"रो क्यों रहे हो? अभी तो शादी भी नहीं हुई!\"","mummy hanseen, \"ro kyon rahe ho? abhi to shaadi bhi nahin hui!\"","Mummy laughed, \"Why are you crying? You're not even married yet!\""],
  ["पहला पराठा टेढ़ा बना, लेकिन दूसरा बिल्कुल गोल था।","pehla paraatha tedha bana, lekin doosra bilkul gol tha.","The first paratha came out crooked, but the second was perfectly round."],
  ["मम्मी ने कहा, \"शाबाश! अगली बार तुम हमारे लिए बनाना।\"","mummy ne kaha, \"shaabaash! agli baar tum hamaare liye banaana.\"","Mummy said, \"Well done! Next time, you make them for us.\""]],
  qs:[["What did Mummy teach Aman?",["Aloo parathas","Samosas","Chai"]],["Why did Aman have tears in his eyes?",["He was chopping onions","He burnt his hand","He was sad"]],["How did the second paratha turn out?",["Perfectly round","Burnt","Crooked"]]]},
 {id:"st16", after:"phone", level:"A2", title:"A bad connection", titleHi:"नेटवर्क की परेशानी", blurb:"A call on a moving train.", lines:[
  ["अमन ट्रेन में था, जब प्रिया का फ़ोन आया।","aman train mein tha, jab priya ka phone aaya.","Aman was on the train when Priya called."],
  ["\"हेलो? अमन? आवाज़ नहीं आ रही!\"","\"hello? aman? aavaaz nahin aa rahi!\"","\"Hello? Aman? I can't hear you!\""],
  ["\"हेलो! मैं ट्रेन में हूँ, नेटवर्क ठीक नहीं है।\"","\"hello! main train mein hoon, network theek nahin hai.\"","\"Hello! I'm on the train, the signal is bad.\""],
  ["\"क्या? तुम कहाँ हो?\"","\"kya? tum kahaan ho?\"","\"What? Where are you?\""],
  ["\"ट्रेन में! मैं बाद में फ़ोन करता हूँ!\"","\"train mein! main baad mein phone karta hoon!\"","\"On the train! I'll call you later!\""],
  ["फ़ोन कट गया।","phone kat gaya.","The call dropped."],
  ["दो मिनट बाद अमन को मैसेज आया: \"ठीक है। पहुँचकर फ़ोन करना, जान।\"","do minute baad aman ko message aaya: \"theek hai. pahunchkar phone karna, jaan.\"","Two minutes later Aman got a message: \"Okay. Call me when you get there, love.\""]],
  qs:[["Where was Aman?",["On a train","At home","At work"]],["What was the problem?",["The signal was bad","His phone had died","He was busy"]],["What did Priya ask in her message?",["To call when he arrives","To come home","To buy tickets"]]]},
 {id:"st17", after:"nature", level:"B1", title:"Under the stars", titleHi:"तारों के नीचे", blurb:"A cold night in the mountains.", lines:[
  ["छुट्टियों में वे दोनों पहाड़ों पर गए।","chhuttiyon mein ve donon pahaadon par gaye.","On holiday, the two of them went to the mountains."],

const CUSTOM_UNIT={id:"mywords",track:"speak",glyph:"मेरे",title:"My words",blurb:"",items:[],drills:[],stage:0};
function registerCustom(){
  CUSTOM_UNIT.items=Object.keys(S.custom||{}).map(id=>{ const c=S.custom[id]; const it={id,hi:c.hi,rom:c.rom,en:c.en,custom:true}; ITEM[id]=it; UNIT_OF[id]=CUSTOM_UNIT; return it; });
}
function addCustom(hi,rom,en){
  const clean=s=>String(s||"").replace(/["“”]/g,"").trim();
  hi=clean(hi); rom=clean(rom); en=clean(en);
  if(!hi||!rom||!en) return;
  const existing=Object.values(ITEM).find(x=>!x.cloze && normDeva(x.hi)===normDeva(hi));
  if(existing && S.items[existing.id]){ toast("Already in your review deck"); return; }
  if(existing){ S.items[existing.id]={b:1,d:Date.now()+HOUR,c:0,w:0}; save(); toast("Added to your review deck"); return; }
  let h=0; for(const ch of hi) h=(h*31+ch.codePointAt(0))>>>0;
  const id="cw"+h.toString(36);
  S.custom[id]={hi:hi.slice(0,120),rom:rom.slice(0,160),en:en.slice(0,160),at:Date.now()};
  S.items[id]={b:1,d:Date.now()+HOUR,c:0,w:0};
  registerCustom(); save(); toast("Added to your review deck");
}

   SPEECH INPUT (dictation, Hindi)
   ============================================================ */
const Dict={api:null, ok:false, listening:false, target:null, buf:"", partial:""};
// Outside Claude (the home-screen app), use the browser's own speech recognition in Hindi
function webSpeechDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let rec=null; const h={};
  return {
    onPartial(f){ h.p=f; return ()=>{}; }, onFinal(f){ h.f=f; return ()=>{}; }, onState(f){ h.s=f; return ()=>{}; },
    start(){ return new Promise((res,rej)=>{ try{
      rec=new SR(); rec.lang="hi-IN"; rec.interimResults=true; rec.continuous=false;
      rec.onstart=()=>{ h.s&&h.s({state:"listening"}); res(); };
      rec.onresult=e=>{ let fin="",mid=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t; else mid+=t; } if(mid&&h.p) h.p({text:mid}); if(fin&&h.f) h.f({text:fin}); };
      rec.onerror=e=>{ const c=e.error==="not-allowed"||e.error==="service-not-allowed"?"not_granted":e.error==="language-not-supported"?"unavailable":"upstream_error"; rec=null; h.s&&h.s({state:"idle",reason:c}); rej({code:c}); };
      rec.onend=()=>{ if(rec){ rec=null; h.s&&h.s({state:"idle",reason:"stopped"}); } };
      rec.start(); }catch(e){ rej({code:"unavailable"}); } }); },
    stop(){ try{ rec&&rec.stop(); }catch(e){} return Promise.resolve(); },
    active(){ return !!rec; }
  };
}
async function initDictation(){
  try{
    let d=null;
    if(window.claude&&window.claude.use) d=await window.claude.use("dictation");
    if(!d && !(window.claude&&window.claude.use)) d=webSpeechDictation();
    if(!d) return;
    Dict.api=d; Dict.ok=true;
    d.onPartial(({text})=>{ Dict.partial=text||""; dictUpdate(false); });
    d.onFinal(({text})=>{ Dict.buf=(Dict.buf+" "+(text||"")).trim(); Dict.partial=""; dictUpdate(false); });
    d.onState(({state,reason})=>{
      Dict.listening = state!=="idle";
      if(state==="idle"){
        if(reason==="not_granted"||reason==="unavailable") Dict.ok=false;
        else if(reason==="rate_limited") toast("Too many recordings at once. Try again shortly.");
        else if(reason==="upstream_error") toast("The microphone didn't work. Try again.");
        dictUpdate(true);
      }
    });
    rerender();
  }catch(e){}
}
function startDict(target){
  if(!Dict.api) return;
  Dict.target=target; Dict.buf=""; Dict.partial="";
  Dict.api.start({language:"hi"}).catch(e=>{
    const c=e&&e.code; Dict.listening=false;
    if(c==="not_granted"||c==="unavailable"){ Dict.ok=false; toast(c==="unavailable"?"Hindi speech input isn't available here.":"The microphone is off for this page."); }
    else if(c!=="dismissed"&&c!=="stopped") toast("Couldn't start the microphone.");
    rerenderMic();
  });
  Dict.listening=true; rerenderMic();
}
function stopDict(){ if(Dict.api && Dict.listening) Dict.api.stop().catch(()=>{}); }
function rerenderMic(){ if(session) renderSession(); else if(view.name==="talk") render(); }
function speechMatch(heard, it){
  if(!heard) return 0;
  const deva=/[ऀ-ॿ]/.test(heard);
  const target = deva ? normDeva(H(it)).replace(/\s/g,"") : normRom(R(it)).join("");
  const got = deva ? normDeva(heard).replace(/\s/g,"") : normRom(heard).join("");
  return 1 - lev(got,target)/Math.max(target.length,1);
}
function dictUpdate(done){
  const text=(Dict.buf+" "+Dict.partial).trim();
  if(Dict.target==="talk"){ Talk.draft=text; const i=$("#talk-in"); if(i) i.value=text; if(done) rerenderMic(); return; }
  if(Dict.target==="speak" && session){
    const ex=session.queue[session.i]; if(!ex||ex.t!=="speak") return;
    if(!done){ const h=$("#heard"); if(h) h.textContent=text; ex.heard=text; return; }
    ex.heard=text;
    if(text){ ex.heardOk = speechMatch(text, ex.it)>=0.75; if(ex.heardOk) ex.revealed=true; }
    renderSession();
    if(ex.heardOk){ say(H(ex.it)); const y=$('[data-act="selfyes"]'); if(y) y.focus(); }
  }
}

  return `You are helping someone practise spoken Hindi through role-play. ${scen().brief}

function talkHistory(){

  return out;
}
function talkError(e){

    : c==="invalid_json"?"The reply came back garbled. Tap Send again."

async function talkSend(){
  const text=(Talk.draft||"").trim(); if(!text||Talk.busy||!Talk.sample) return;
  stopDict();
  Talk.msgs.push({from:"me",text}); Talk.draft=""; Talk.busy=true; Talk.err=""; Talk.hint=null; render();
  try{
    const r=await Talk.sample.json(talkHistory(),{modelTier:"default"});
    if(!r||typeof r.hi!=="string"||!r.hi.trim()) throw {code:"invalid_json"};
    const me=Talk.msgs[Talk.msgs.length-1];
    if(r.correction&&typeof r.correction==="object"&&r.correction.hi) me.correction={hi:String(r.correction.hi),rom:String(r.correction.rom||""),en:String(r.correction.en||""),note:String(r.correction.note||"")};
    const words=Array.isArray(r.words)?r.words.filter(w=>w&&w.hi&&w.en).slice(0,3).map(w=>({hi:String(w.hi),rom:String(w.rom||""),en:String(w.en)})):[];
    Talk.msgs.push({from:"them",hi:String(r.hi),rom:String(r.rom||""),en:String(r.en||""),words});
    S.stats.chats++; S.xp+=2; const k=dayKey(); S.days[k]=(S.days[k]||0)+2; S.act[k]=S.act[k]||{it:0,se:0}; S.act[k].it++;
    checkAch(false).forEach(id=>{ const a=ACHIEVEMENTS.find(x=>x.id===id); if(a) toast("Achievement: "+a.t); });
    save();
    Talk.busy=false;
    if(view.name==="talk"){ render(); say(String(r.hi)); }
  }catch(e){
    Talk.busy=false; Talk.err=talkError(e);
    const last=Talk.msgs[Talk.msgs.length-1]; if(last&&last.from==="me"){ Talk.msgs.pop(); Talk.draft=last.text; }
    if(view.name==="talk") render();
  }
}
async function talkHint(){
  if(Talk.busy||!Talk.sample) return;
  Talk.busy=true; Talk.err=""; render();
  try{
    const h=talkHistory();
    h.push({role:"user",content:`(This message is not from the learner.) Suggest ONE short, natural thing the learner could say next, at their level, speaking as a ${female()?"woman":"man"}. Reply with only JSON: {"hi":"…","rom":"…","en":"…"}`});
    const r=await Talk.sample.json(h,{modelTier:"quick"});
    if(r&&r.hi) Talk.hint={hi:String(r.hi),rom:String(r.rom||""),en:String(r.en||"")};
  }catch(e){ Talk.err=e&&e.code==="rate_limited"?talkError(e):"Couldn't get a hint right now. Try again."; }
  Talk.busy=false; if(view.name==="talk") render();
}

function futEnd(k,g,vstem){ // [deva after vowel, deva after consonant, rom]
  const key = k==="1"? (g==="f"?"oongi":"oonga") : k==="2"? (g==="f"?"ogi":"oge") : k==="3"? (g==="f"?"egi":"ega") : "enge";
  const T={oonga:["ऊँगा","ूँगा"],oongi:["ऊँगी","ूँगी"],oge:["ओगे","ोगे"],ogi:["ओगी","ोगी"],ega:["एगा","ेगा"],egi:["एगी","ेगी"],enge:["एँगे","ेंगे"]};
  return {deva:T[key][vstem?0:1], rom:key};

function enBe(s){ return s.k==="1"?"am": s.k==="3"?"is":"are"; }
function conj(v, s, tense){
  const [inf,st,rs,en,en3,ing,past]=v, a=agrOf(s), aux=AUX[s.k];
  let hi, rom, alt=[], enS;
  const E=s.en==="I"?"I":s.en;
  if(tense==="hab"){ hi=`${s.hi} ${st}${TA[a][0]} ${aux[0]}`; rom=`${s.r} ${rs}${TA[a][1]} ${aux[1]}`; enS=`${E} ${s.k==="3"?en3:en}`; }
  else if(tense==="cont"){ hi=`${s.hi} ${st} ${RAHA[a][0]} ${aux[0]}`; rom=`${s.r} ${rs} ${RAHA[a][1]} ${aux[1]}`; enS=`${E} ${enBe(s)} ${ing}`; }
  else if(tense==="used"){ const tf=(s.k==="2"&&s.g==="f"); hi=`${s.hi} ${st}${TA[a][0]} ${tf?"थीं":THA[a][0]}`; rom=`${s.r} ${rs}${TA[a][1]} ${THA[a][1]}`; if(tf) alt.push(`${s.r} ${rs}${TA[a][1]} thin`); enS=`${E} used to ${en}`; }
  else if(tense==="fut"){ const vs=/[aeiou]$/.test(rs); const f=futEnd(s.k,s.g,vs); hi=`${s.hi} ${st}${f.deva}`;
    let r=f.rom, rr=(rs==="reh"?"rah":rs); if(rs==="reh") alt.push(`${s.r} reh${r}`);
    if(vs && r[0]==="e"){ alt.push(`${s.r} ${rs}${r}`); r="y"+r; }
    if(vs && /o$/.test(rs) && r.startsWith("oon")) alt.push(`${s.r} ${rs}u${r.slice(2)}`);
    rom=`${s.r} ${rr}${r}`; enS=`${E} will ${en}`; }
  else if(tense==="past"){ const i=a==="m"?0:a==="f"?2:4; const tf=(s.k==="2"&&s.g==="f"); hi=`${s.hi} ${past[i]}${tf?"ं":""}`; rom=`${s.r} ${past[i+1]}`; if(tf) alt.push(`${s.r} ${past[i+1]}n`); enS=`${E} ${past[6]}`; }
  return {hi, rom, alt, en:enS};
}
// Wrong forms: other agreements / auxiliaries for the same subject, never a form that is also correct
function gymWrong(v, s, tense, right){
  const [inf,st,rs,en,en3,ing,past]=v, ra=agrOf(s), rk=(s.k==="a"?"p":s.k);
  const okAlso=(a,k)=> (s.k==="3"&&a==="p"&&k==="p") || (s.k==="3"&&s.g==="f"&&a==="f"&&k==="p") || ((s.k==="p"||s.k==="a")&&a==="f"&&k==="p");
  const c=[];
  if(tense==="hab"||tense==="cont"){
    ["m","f","p"].forEach(a=>["1","2","3","p"].forEach(k=>{ if((a===ra&&k===rk)||okAlso(a,k)) return;
      const h = tense==="hab"? `${s.hi} ${st}${TA[a][0]} ${AUX[k][0]}` : `${s.hi} ${st} ${RAHA[a][0]} ${AUX[k][0]}`;
      c.push({h, d:(a!==ra)+(k!==rk)}); }));
  } else if(tense==="used"){
    ["m","f","p"].forEach(a=>["m","f","p"].forEach(b=>{ if(a===ra&&b===ra) return; if(a===b && okAlso(a,"p")) return;
      c.push({h:`${s.hi} ${st}${TA[a][0]} ${THA[b][0]}`, d:(a!==ra)+(b!==ra)}); }));
  } else if(tense==="fut"){
    const vs=/[aeiou]$/.test(rs);
    [["1","m"],["1","f"],["2","m"],["2","f"],["3","m"],["3","f"],["p","m"]].forEach(([k,g])=>{
      if(k==="p" && (s.k==="3"||s.k==="p"||s.k==="a")) return;
      const h=`${s.hi} ${st}${futEnd(k,g,vs).deva}`; if(h!==right.hi) c.push({h, d:(k!==rk)+(g!==s.g)}); });
  } else if(tense==="past"){
    [["m",0],["f",2],["p",4]].forEach(([a,i])=>{ if(a===ra) return; if(a==="p"&&s.k==="3") return; if(a==="f"&&(s.k==="p"||s.k==="a")) return;
      c.push({h:`${s.hi} ${past[i]}`, d:1}); });
  }
  const seen=new Set([right.hi]);
  return shuffle(c).sort((x,y)=>x.d-y.d).map(x=>x.h).filter(h=>!seen.has(h)&&seen.add(h)).slice(0,3);
}

/* ============================================================
   TIME GYM: sava, saadhe, paune, dedh, dhaai
   ============================================================ */
function timeHi(h,m){
  const N=x=>NUMS[x-1], nx=h%12+1;
  if(m===0)  return [`${N(h).hi} बजे`, `${N(h).rom} baje`];
  if(m===15) return [`सवा ${N(h).hi} बजे`, `sava ${N(h).rom} baje`];
  if(m===30){ if(h===1) return ["डेढ़ बजे","dedh baje"]; if(h===2) return ["ढाई बजे","dhaai baje"]; return [`साढ़े ${N(h).hi} बजे`, `saadhe ${N(h).rom} baje`]; }
  return [`पौने ${N(nx).hi} बजे`, `paune ${N(nx).rom} baje`];
}
const digi=(h,m)=>`${h}:${String(m).padStart(2,"0")}`;
function clockSVG(h,m){
  const ha=((h%12)+m/60)*30, ma=m*6, P=(r,a)=>[(50+r*Math.sin(a*Math.PI/180)).toFixed(2),(50-r*Math.cos(a*Math.PI/180)).toFixed(2)];
  const ticks=[...Array(12)].map((_,i)=>{ const r1=i%3?40:35, [x1,y1]=P(r1,i*30), [x2,y2]=P(44,i*30); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--ink);stroke-width:${i%3?1.5:3};stroke-linecap:round"/>`; }).join("");
  const [hx,hy]=P(24,ha), [mx,my]=P(36,ma);
  return `<svg class="clock" viewBox="0 0 100 100" role="img" aria-label="Clock showing ${digi(h,m)}"><circle cx="50" cy="50" r="48" style="fill:var(--surface);stroke:var(--hair);stroke-width:1.5"/>${ticks}<line x1="50" y1="50" x2="${hx}" y2="${hy}" style="stroke:var(--ink);stroke-width:5;stroke-linecap:round"/><line x1="50" y1="50" x2="${mx}" y2="${my}" style="stroke:var(--ink);stroke-width:2.6;stroke-linecap:round"/><circle cx="50" cy="50" r="3.6" style="fill:var(--rani)"/></svg>`;
}
function startTimeGym(){
  const q=[];
  for(let i=0;i<10;i++){
    const h=1+Math.floor(Math.random()*12), m=pickOne([0,15,30,30,45,45]);
    const [hi,rom]=timeHi(h,m), it=gymItem(hi,rom,digi(h,m));
    const prev=h===1?12:h-1, next=h%12+1;
    const cand=[[h,0],[h,15],[h,30],[h,45],[prev,45],[next,15],[next,45]].filter(([a,b])=>!(a===h&&b===m));
    const seen=new Set([hi]), wrong=[];
    for(const [a,b] of shuffle(cand)){ const w=timeHi(a,b)[0]; if(!seen.has(w)){ seen.add(w); wrong.push([a,b]); } if(wrong.length===3) break; }
    const opts=shuffle([[h,m]].concat(wrong)).map(([a,b])=>({id:`${a}:${b}`, hi:timeHi(a,b)[0], rom:timeHi(a,b)[1], dg:digi(a,b)}));
    q.push({t:"clock", mode:i%2?"toclock":"tohindi", it, h, m, ans:`${h}:${m}`, opts, sel:null});
  }
  beginSession({kind:"gym", queue:q});
}
/* ============================================================
   STATE & PERSISTENCE
   ============================================================ */
const LS_KEY = "dilse-hindi-v1";
const DAY = 864e5, HOUR = 36e5;
const INTERVALS = [0, 12*HOUR, 2*DAY, 5*DAY, 12*DAY, 30*DAY]; // by box 0..5
function freshState(){ return {v:1, xp:0, days:{}, items:{}, units:{}, scenes:{}, stories:{}, custom:{}, act:{}, ach:{}, stats:{lessons:0,reviews:0,perfect:0,bestCombo:0,scenes:0,spoken:0,chats:0,stories:0,gym:0},
  settings:{gender:"m", rom:"auto", goal:30, name:"", sound:true}, settingsAt:0, tipsSeen:{}, updatedAt:0, resetAt:0}; }
let S = freshState();
function normalizeState(o){ const f=freshState(); if(!o||typeof o!=="object") return f;
  const s=Object.assign(f,o); s.settings=Object.assign(freshState().settings,o.settings||{}); s.stats=Object.assign(freshState().stats,o.stats||{});
  ["days","items","units","scenes","stories","custom","act","ach","tipsSeen"].forEach(k=>{ if(!s[k]||typeof s[k]!=="object") s[k]={}; }); return s; }
try{ const raw=localStorage.getItem(LS_KEY); if(raw) S=normalizeState(JSON.parse(raw)); }catch(e){}
registerCustom();

// Merge two progress copies without losing work from either side.
function mergeStates(a,b){
  a=normalizeState(a); b=normalizeState(b);
  if((a.resetAt||0) > (b.updatedAt||0)) return a;
  if((b.resetAt||0) > (a.updatedAt||0)) return b;
  const m=freshState(), keys=o=>Object.keys(o||{}), both=(x,y)=>new Set([...keys(x),...keys(y)]);
  m.xp=Math.max(a.xp,b.xp);
  both(a.days,b.days).forEach(k=>m.days[k]=Math.max(a.days[k]||0,b.days[k]||0));
  both(a.units,b.units).forEach(k=>m.units[k]=Math.max(a.units[k]||0,b.units[k]||0));
  both(a.scenes,b.scenes).forEach(k=>m.scenes[k]=Math.max(a.scenes[k]||0,b.scenes[k]||0));
  both(a.stories,b.stories).forEach(k=>m.stories[k]=Math.max(a.stories[k]||0,b.stories[k]||0));
  [a.custom,b.custom].forEach(o=>keys(o).forEach(k=>{ if(!m.custom[k]) m.custom[k]=o[k]; }));
  both(a.act,b.act).forEach(k=>{ const x=a.act[k]||{}, y=b.act[k]||{}; m.act[k]={it:Math.max(x.it||0,y.it||0), se:Math.max(x.se||0,y.se||0)}; });
  keys(m.stats).forEach(k=>m.stats[k]=Math.max(a.stats[k]||0,b.stats[k]||0));
  both(a.items,b.items).forEach(k=>{ const x=a.items[k], y=b.items[k];
    if(!x||!y){ m.items[k]=Object.assign({},x||y); return; }
    const sx=(x.c||0)+(x.w||0), sy=(y.c||0)+(y.w||0);
    m.items[k]=Object.assign({}, sx>sy?x : sy>sx?y : ((x.d||0)>=(y.d||0)?x:y)); });
  [a.ach,b.ach].forEach(o=>keys(o).forEach(k=>m.ach[k]=Math.min(m.ach[k]||Infinity,o[k])));
  [a.tipsSeen,b.tipsSeen].forEach(o=>keys(o).forEach(k=>m.tipsSeen[k]=1));
  const ns=(a.settingsAt||0)>=(b.settingsAt||0)?a:b;
  m.settings=Object.assign({},ns.settings); m.settingsAt=ns.settingsAt||0;
  m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0); m.resetAt=Math.max(a.resetAt||0,b.resetAt||0);
  return m;
}

const Sync = {mode:"local", ref:null, timer:null, writing:false, pending:false, fails:0};
function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(Sync.ref){ clearTimeout(Sync.timer); Sync.timer=setTimeout(pushRemote, 600); }
}
function setSyncMode(m){
  if(Sync.mode===m) return; Sync.mode=m;
  const a=document.activeElement;
  if(view.name==="profile" && !session && !(a && /INPUT|SELECT/.test(a.tagName))) render();
}
async function pushRemote(){
  if(!Sync.ref) return;
  if(Sync.writing){ Sync.pending=true; return; }
  Sync.writing=true;
  try{ await Sync.ref.set(JSON.parse(JSON.stringify(S))); Sync.fails=0; setSyncMode("cloud"); }
  catch(e){
    if(e && e.code==="invalid_argument"){ Sync.ref=null; setSyncMode("local"); }
    else { Sync.fails++; setSyncMode("retry"); clearTimeout(Sync.timer); Sync.timer=setTimeout(pushRemote, Math.min(60000, 4000*Sync.fails)); }
  }
  Sync.writing=false;
  if(Sync.pending){ Sync.pending=false; pushRemote(); }
}
async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc("data/users/"+id+"/progress");
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),12000))]);
    Sync.ref = ref;
    if(snap.exists){
      const remote = normalizeState(snap.data());
      const merged = mergeStates(S, remote);
      const changedLocal = JSON.stringify(merged)!==JSON.stringify(S);
      S = merged; registerCustom();
      try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
      if(JSON.stringify(merged)!==JSON.stringify(remote)) pushRemote(); else setSyncMode("cloud");
      if(changedLocal && !session) render();
    } else if(S.updatedAt) pushRemote();
    else setSyncMode("cloud");
  }catch(e){ /* stay local */ }
}

/* ============================================================
   AUDIO (Claude voice, browser Hindi voice as fallback)
   ============================================================ */
const AudioS = {tts:null, voice:null, denied:false, web:false, keep:[]};
function rerender(){ if(session) renderSession(); else render(); }
// Prefer a named Hindi voice when the device lists one; otherwise speak with lang hi-IN and let the system choose
function pickHindiVoice(){
  try{ const hi=speechSynthesis.getVoices().filter(v=>/^hi(-|_|$)/i.test(v.lang));
    if(hi.length) AudioS.voice = hi.find(v=>/enhanced|premium|natural|google/i.test(v.name)) || hi.find(v=>/lekha/i.test(v.name)) || hi[0]; }catch(e){}
}
function initBrowserVoice(){
  if(AudioS.web || !("speechSynthesis" in window) || typeof SpeechSynthesisUtterance==="undefined") return;
  AudioS.web=true;
  pickHindiVoice();
  try{ speechSynthesis.addEventListener("voiceschanged",pickHindiVoice); }catch(e){}
  let n=0; const t=setInterval(()=>{ pickHindiVoice(); if(AudioS.voice || ++n>24) clearInterval(t); },250); // iOS fills the list late and may never fire voiceschanged
  if(!AudioS.tts) rerender();
}
async function initAudio(){
  initBrowserVoice();                               // the device voice is always ready as a backup
  try{ if(window.claude && window.claude.use){ const t = await window.claude.use("tts"); if(t){ AudioS.tts=t; rerender(); } } }catch(e){}
}
function hasAudio(){ return !AudioS.denied && !!(AudioS.tts || AudioS.web); }
function webSpeak(texts, slow){
  try{
    const ss=speechSynthesis;
    if(slow) texts=texts.flatMap(t=>t.split(/\s+/).filter(Boolean));
    const go=()=>{
      AudioS.keep=texts.map(t=>{ const u=new SpeechSynthesisUtterance(t); u.lang=AudioS.voice?AudioS.voice.lang:"hi-IN"; if(AudioS.voice) u.voice=AudioS.voice; u.rate=slow?0.5:0.9; u.volume=1; return u; }); // kept referenced so the browser can't garbage-collect them mid-sentence
      AudioS.keep.forEach(u=>ss.speak(u));
      if(ss.paused) ss.resume();
    };
    if(ss.speaking || ss.pending) ss.cancel();
    go();
    setTimeout(()=>{ if(!ss.speaking && !ss.pending) go(); },250);   // WebKit drops speech started in the same tick as cancel()
  }catch(e){}
}
function say(text, slow){
  if(AudioS.denied || !text) return;
  if(AudioS.tts){
    AudioS.tts.speak(text,{language:"hi", rate: slow?0.55:0.95}).catch(e=>{
      const c=e&&e.code;
      if(c==="not_granted"){ AudioS.tts=null; AudioS.denied=true; rerender(); }          // the viewer switched reading aloud off: respect it
      else if(c==="unavailable"){ AudioS.tts=null; rerender(); webSpeak([text],slow); }
      else if(c!=="stopped" && AudioS.web) webSpeak([text],slow);                        // busy, rate-limited or a service hiccup: use the device voice this time
    });
    return;
  }
  if(AudioS.web) webSpeak([text],slow);
}
// iOS only allows speech after a tap; prime it silently on the very first touch
addEventListener("pointerdown",function primeSpeech(){ removeEventListener("pointerdown",primeSpeech,true);
  try{ if(AudioS.web && !AudioS.tts){ const u=new SpeechSynthesisUtterance("."); u.volume=0; u.rate=2; u.lang="hi-IN"; speechSynthesis.speak(u); } }catch(e){} },true);
